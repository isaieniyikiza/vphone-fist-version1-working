<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f83e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Virtual Phone">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <title>Virtual Phone</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #10131a; }
    iframe { width: 100%; height: 100%; border: 0; display: block; background: #10131a; }
    .install-banner {
      position: fixed; z-index: 20; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom));
      display: none; align-items: center; gap: 10px; max-width: 480px; margin: auto;
      padding: 10px 10px 10px 13px; border: 1px solid rgba(255,255,255,.14); border-radius: 15px;
      background: rgba(23,27,38,.96); color: #fff; box-shadow: 0 16px 50px rgba(0,0,0,.38);
      backdrop-filter: blur(18px);
    }
    .install-banner.show { display: flex; }
    .install-banner span { flex: 1; font: 600 12px/1.35 Arial, sans-serif; }
    .install-banner button { min-height: 38px; border: 0; border-radius: 10px; padding: 0 12px; background: #4f83e5; color: #fff; font-weight: 700; cursor: pointer; }
    .install-banner .dismiss { width: 38px; padding: 0; background: rgba(255,255,255,.09); }
  </style>
</head>
<body>
  <iframe id="phoneFrame" title="Virtual Phone" src="/virtual-phone/user/user_phone_dashboard.html" allow="camera; microphone; geolocation; clipboard-read; clipboard-write"></iframe>
  <div class="install-banner" id="installBanner" role="dialog" aria-label="Install Virtual Phone">
    <span>Install Virtual Phone as an app on this device</span>
    <button id="installButton" type="button">Install</button>
    <button class="dismiss" id="dismissInstall" type="button" aria-label="Dismiss">&times;</button>
  </div>
  <script>
    (() => {
      let installPrompt = null;
      const banner = document.getElementById('installBanner');
      window.addEventListener('beforeinstallprompt', event => {
        event.preventDefault();
        installPrompt = event;
        banner.classList.add('show');
      });
      document.getElementById('installButton').addEventListener('click', async () => {
        if (!installPrompt) {
          banner.querySelector('span').textContent = 'On iPhone: Share, then Add to Home Screen';
          return;
        }
        installPrompt.prompt();
        await installPrompt.userChoice;
        installPrompt = null;
        banner.classList.remove('show');
      });
      document.getElementById('dismissInstall').addEventListener('click', () => banner.classList.remove('show'));
      window.addEventListener('appinstalled', () => banner.classList.remove('show'));
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(console.error));
      }
    })();
  </script>
</body>
</html>
