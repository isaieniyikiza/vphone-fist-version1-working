                notifPanel: $('notifPanel'),
                notifPanelBody: $('notifPanelBody'),
                clearNotifBtn: $('clearNotifBtn'),
                panelHandle: $('panelHandle'),
                postsContainer: $('postsContainer'),
                createPostBtn: $('createPostBtn'),
                createPostModal: $('createPostModal'),
                postContent: $('postContent'),
                postMediaPreview: $('postMediaPreview'),
                postMediaBtn: $('postMediaBtn'),
                postFileInput: $('postFileInput'),
                postSubmitBtn: $('postSubmitBtn'),
                postCancelBtn: $('postCancelBtn'),
                commentsModal: $('commentsModal'),
                commentsBody: $('commentsBody'),
                closeCommentsModal: $('closeCommentsModal'),
                themeBtn: $('themeBtn'),
                bottomNav: $('bottomNav'),
                notifySound: $('notifySound'),
                confirmModal: $('confirmModal'),
                confirmTitle: $('confirmTitle'),
                confirmMessage: $('confirmMessage'),
                confirmYes: $('confirmYes'),
                confirmNo: $('confirmNo'),
                videoViewer: $('videoViewer'),
                vvVideo: $('vvVideo'),
                vvImage: $('vvImage'),
                vvClose: $('vvClose'),
                vvPlayPause: $('vvPlayPause'),
                vvMute: $('vvMute'),
                vvFullscreen: $('vvFullscreen'),
            };

            // ============================================================
            //  STATE
            // ============================================================
            const STATE = {
                isLoggedIn: false,
                sessionUser: null,
                users: [],
                posts: [],
                darkMode: localStorage.getItem('vphone_theme') === 'dark',
                notifications: [],
                notifCount: 0,
                isNotifPanelOpen: false,
                soundEnabled: localStorage.getItem('vphone_sound') !== 'false',
                muted: new Set(JSON.parse(localStorage.getItem('vphone_muted') || '[]')),
                postFile: null,
                bellVisible: false,
                friendList: [],
                friendRequestCount: 0,
                currentVideoPostId: null,
                pollInterval: null,
                renderedPostsKey: '',
                pendingPostId: new URLSearchParams(window.location.search).get('post'),
                feedErrorNotified: false,
                // Like debounce map
                _likeLock: new Set(),
            };

            // ============================================================
            //  HELPERS
            // ============================================================
            function showNotification(message, kind = 'error') {
                const island = DOM.dynamicIsland;
                island.textContent = message;
                const cls = kind === 'success' ? 'notify-success' : kind === 'info' ? 'notify-info' : 'notify-error';
                island.className = 'dynamic-island ' + cls;
                clearTimeout(island._hideTimer);
                island._hideTimer = setTimeout(() => { island.className = 'dynamic-island';
                    island.textContent = ''; }, CONFIG.NOTIFICATION_DURATION);
            }

            function getInitials(name) { return (name || '?').charAt(0).toUpperCase(); }

            function escapeHTML(value) {
                return String(value || '').replace(/[&<>"']/g, (character) => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;',
                }[character]));
            }

            function getAvatarUrl(user) {
                if (!user) return null;
                const img = user.profile_image;
                if (!img) return null;
                if (img.startsWith('http') || img.startsWith('/')) return img;
                return '/virtual-phone/uploads/profile/' + img;
            }

            function formatTime(value) { return new Date(value).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

            function timeAgo(date) {
                const diff = Math.floor((Date.now() - new Date(date).getTime()) / 1000);
                if (diff < 60) return 'just now';
                if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
                if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
                return new Date(date).toLocaleString();
            }

            function updateClock() {
                const now = new Date();
                const h = String(now.getHours()).padStart(2, '0');
                const m = String(now.getMinutes()).padStart(2, '0');
                DOM.statusTime.textContent = h + ':' + m;
            }

            function updateBadge() {
                const count = STATE.notifCount + STATE.friendRequestCount;
                const badge = DOM.bellBadgeDrag;
                if (badge) {
                    if (count > 0) { badge.textContent = count > 99 ? '99+' : count;
                        badge.classList.add('show'); } else { badge.classList.remove('show'); }
                }
            }

            function applyTheme() {
                DOM.appContainer.classList.toggle('theme-dark', STATE.darkMode);
                DOM.themeBtn.innerHTML = STATE.darkMode ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            }

            function customConfirm(title, message) {
                return new Promise((resolve) => {
                    DOM.confirmTitle.textContent = title;
                    DOM.confirmMessage.textContent = message;
                    DOM.confirmModal.classList.add('active');
                    const yesHandler = () => { DOM.confirmModal.classList.remove('active');
                        DOM.confirmYes.removeEventListener('click', yesHandler);
                        DOM.confirmNo.removeEventListener('click', noHandler);
                        resolve(true); };
                    const noHandler = () => { DOM.confirmModal.classList.remove('active');
                        DOM.confirmYes.removeEventListener('click', yesHandler);
                        DOM.confirmNo.removeEventListener('click', noHandler);
                        resolve(false); };
                    DOM.confirmYes.addEventListener('click', yesHandler);
                    DOM.confirmNo.addEventListener('click', noHandler);
                });
            }

            // ============================================================
            //  VIDEO VIEWER
            // ============================================================
            function openVideoViewer(videoUrl) {
                DOM.videoViewer.classList.remove('image-active');
                DOM.vvImage.removeAttribute('src');
                DOM.vvVideo.src = videoUrl;
                DOM.vvVideo.load();
                DOM.vvVideo.play().catch(() => {});
                DOM.videoViewer.classList.add('active');
                DOM.vvPlayPause.innerHTML = '<i class="fas fa-pause"></i>';
            }

            function openImageViewer(imageUrl) {
                DOM.vvVideo.pause();
                DOM.vvVideo.removeAttribute('src');
                DOM.vvVideo.load();
                DOM.vvImage.src = imageUrl;
                DOM.videoViewer.classList.add('active', 'image-active');
            }

            function closeVideoViewer() {
                DOM.vvVideo.pause();
                DOM.vvVideo.removeAttribute('src');
                DOM.vvVideo.load();
                DOM.vvImage.removeAttribute('src');
                DOM.videoViewer.classList.remove('active', 'image-active');
            }

            DOM.vvClose.addEventListener('click', closeVideoViewer);
            DOM.videoViewer.addEventListener('click', (e) => {
                if (e.target === DOM.videoViewer) closeVideoViewer();
            });

            DOM.vvPlayPause.addEventListener('click', () => {
                if (DOM.vvVideo.paused) {
                    DOM.vvVideo.play();
                    DOM.vvPlayPause.innerHTML = '<i class="fas fa-pause"></i>';
                } else {
                    DOM.vvVideo.pause();
                    DOM.vvPlayPause.innerHTML = '<i class="fas fa-play"></i>';
                }
            });

            DOM.vvMute.addEventListener('click', () => {
                DOM.vvVideo.muted = !DOM.vvVideo.muted;
                DOM.vvMute.innerHTML = DOM.vvVideo.muted ? '<i class="fas fa-volume-mute"></i>' :
                    '<i class="fas fa-volume-up"></i>';
            });

            DOM.vvFullscreen.addEventListener('click', () => {
                if (DOM.vvVideo.requestFullscreen) {
                    DOM.vvVideo.requestFullscreen().catch(() => {});
                } else if (DOM.vvVideo.webkitRequestFullscreen) {
                    DOM.vvVideo.webkitRequestFullscreen();
                }
            });

            document.addEventListener('keydown', (e) => {
                if (!DOM.videoViewer.classList.contains('active')) return;
                if (e.key === 'Escape') { closeVideoViewer(); }
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    DOM.vvPlayPause.click();
                }
                if (e.key === 'm' || e.key === 'M') {
                    DOM.vvMute.click();
                }
            });

            // ============================================================
            //  NOTIFICATIONS  (local storage only – no PHP dependency)
            // ============================================================
            function getNotifStorageKey() { return 'vphone_notifications'; }

            function saveNotifsToStorage() { try { localStorage.setItem(getNotifStorageKey(), JSON.stringify(STATE
                        .notifications)); } catch (e) {} }

            function loadNotifsFromStorage() {
                try {
                    const data = localStorage.getItem(getNotifStorageKey());
                    if (data) { STATE.notifications = JSON.parse(data);
                        STATE.notifCount = STATE.notifications.length;
                        renderNotificationPanel();
                        updateBadge(); return true; }
                } catch (e) {}
                return false;
            }

            function clearNotifications() {
                STATE.notifications = [];
                STATE.notifCount = 0;
                saveNotifsToStorage();
                renderNotificationPanel();
                updateBadge();
                showNotification('Cleared', 'success');
            }

            function addLocalNotification(senderId, messageText) {
                const entry = { sender_id: senderId, message: messageText || 'Sent a message', time: new Date()
                        .toISOString() };
                STATE.notifications.push(entry);
                STATE.notifCount = STATE.notifications.length;
                saveNotifsToStorage();
                renderNotificationPanel();
                updateBadge();
                showSnippetBanner(senderId, messageText);
                if (STATE.soundEnabled && !STATE.muted.has(STATE.sessionUser?.id)) {
                    DOM.notifySound.currentTime = 0;
                    DOM.notifySound.play().catch(() => {});
                }
            }

            function showSnippetBanner(senderId, message) {
                const container = document.getElementById('notifSnippetContainer');
                const sender = STATE.users.find(u => u.id === senderId);
                const name = sender ? (sender.username || 'User') : 'Someone';
                const banner = document.createElement('div');
                banner.className = 'notif-banner';
                banner.innerHTML = `
                    <div style="width:32px;height:32px;border-radius:50%;background:#5865F2;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;color:#fff;font-weight:600;">${getInitials(name)}</div>
                    <div style="flex:1;min-width:0;"><div style="font-size:12px;font-weight:600;color:#f4f4f5;">${name}</div><div style="font-size:11px;color:#b0b0b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${message || 'Sent a message'}</div></div>
                    <button style="background:none;border:none;color:rgba(255,255,255,0.4);cursor:pointer;font-size:14px;padding:4px;flex-shrink:0;" class="notif-close"><i class="fas fa-times"></i></button>
                `;
                banner.addEventListener('click', (e) => {
                    if (e.target.closest('.notif-close')) return;
                    const user = STATE.users.find(u => u.id === senderId);
                    if (user) window.location.href = 'vphone_chat.html?user=' + user.id;
                });
                banner.querySelector('.notif-close').addEventListener('click', (e) => {
                    e.stopPropagation();
                    banner.classList.add('hiding');
                    setTimeout(() => { if (banner.parentNode) banner.remove(); }, 300);
                });
                container.appendChild(banner);
                setTimeout(() => {
                    if (banner.parentNode) {
                        banner.classList.add('hiding');
                        setTimeout(() => { if (banner.parentNode) banner.remove(); }, 300);
                    }
                }, 6000);
            }

            function renderNotificationPanel() {
                const body = DOM.notifPanelBody;
                body.innerHTML = '';
                const notifs = STATE.notifications || [];
                if (notifs.length === 0) {
                    body.innerHTML =
                        `<div class="empty-notif"><i class="fas fa-bell-slash"></i><p>No notifications yet</p></div>`;
                    return;
                }
                const sorted = [...notifs].reverse();
                sorted.forEach((n) => {
                    const div = document.createElement('div');
                    div.className = 'notif-item';
                    const sender = STATE.users.find(u => u.id === n.sender_id);
                    const senderName = sender ? (sender.username || 'User') : 'User ' + n.sender_id;
                    div.innerHTML =
                        `<div class="notif-sender">${senderName}</div><div class="notif-msg">${n.message || 'Sent a message'}</div><span class="notif-time">${n.time ? new Date(n.time).toLocaleString() : ''}</span>`;
                    div.addEventListener('click', () => {
                        if (sender) window.location.href = 'vphone_chat.html?user=' + sender.id;
                        if (STATE.isNotifPanelOpen) toggleNotifPanel(false);
                    });
                    body.appendChild(div);
                });
            }

            function toggleNotifPanel(forceOpen) {
                const panel = DOM.notifPanel;
                const overlay = DOM.notifOverlay;
                const isOpen = panel.classList.contains('open');
                if (forceOpen === true || (forceOpen !== false && !isOpen)) {
                    panel.classList.add('open');
                    overlay.classList.add('show');
                    STATE.isNotifPanelOpen = true;
                    // Just re-render from storage
                    loadNotifsFromStorage();
                } else {
                    panel.classList.remove('open');
                    overlay.classList.remove('show');
                    STATE.isNotifPanelOpen = false;
                }
            }

            // ============================================================
            //  API CALLS  –  all match server.js
            // ============================================================

            // ----- USERS -----
            async function fetchUsers() {
                if (!STATE.sessionUser) return;
                try {
                    const res = await fetch(CONFIG.USERS_URL);
                    const data = await res.json();
                    if (data.success) {
                        STATE.users = data.users || [];
                        try { localStorage.setItem('vphone_users', JSON.stringify(STATE.users)); } catch (e) {}
                    }
                } catch (error) { console.error('Fetch users error:', error); }
            }

            // ----- POSTS -----
            async function fetchPosts() {
                try {
                    const res = await fetch(CONFIG.POSTS_URL);
                    if (!res.ok) throw new Error(`Could not load posts (HTTP ${res.status})`);
                    const data = await res.json();
                    if (!data.success || !Array.isArray(data.posts)) {
                        throw new Error(data.message || 'The post feed returned an invalid response');
                    }
                    STATE.posts = data.posts;
                    const postsKey = JSON.stringify(STATE.posts);
                    if (postsKey !== STATE.renderedPostsKey) {
                        STATE.renderedPostsKey = postsKey;
                        renderPosts();
                    }
                    if (STATE.pendingPostId) {
                        const target = Array.from(DOM.postsContainer.querySelectorAll('.post-card'))
                            .find(card => String(card.dataset.postid) === String(STATE.pendingPostId));
                        if (target) {
                            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            target.classList.add('new-post');
                            STATE.pendingPostId = null;
                        }
                    }
                    STATE.feedErrorNotified = false;
                    return true;
                } catch (error) {
                    console.error('Fetch posts error:', error);
                    if (!STATE.posts.length) {
                        DOM.postsContainer.innerHTML = `
                            <div class="feed-state feed-error">
                                <i class="fas fa-triangle-exclamation"></i>
                                <p>${escapeHTML(error.message || 'Could not load posts.')}</p>
                                <button type="button" data-action="retry-feed">Try again</button>
                            </div>`;
                    }
                    if (!STATE.feedErrorNotified) {
                        showNotification('Could not load posts. Check that the server is running.', 'error');
                        STATE.feedErrorNotified = true;
                    }
                    return false;
                }
            }

            async function createPost(content, mediaFile) {
                try {
                    const formData = new FormData();
                    formData.append('user_id', STATE.sessionUser.id);
                    formData.append('content', content || '');
                    if (mediaFile) formData.append('media', mediaFile);

                    const res = await fetch(CONFIG.POSTS_URL, { method: 'POST', body: formData });
                    const data = await res.json();
                    if (data.success) {
                        showNotification('Post created! 🎉', 'success');
                        await fetchPosts();
                        DOM.createPostModal.classList.remove('active');
                        DOM.postContent.value = '';
                        DOM.postMediaPreview.innerHTML = '';
                        DOM.postMediaPreview.style.display = 'none';
                        STATE.postFile = null;
                        DOM.postFileInput.value = '';
                        return true;
                    } else {
                        showNotification(data.message || 'Failed to create post', 'error');
                        return false;
                    }
                } catch (e) { console.error(e);
                    showNotification('Error creating post', 'error');
                    return false;
                }
            }

            async function deletePost(postId) {
                try {
                    const res = await fetch(CONFIG.POST_URL(postId), {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: STATE.sessionUser.id })
                    });
                    const data = await res.json();
                    if (data.success) {
                        showNotification('Post deleted', 'success');
                        await fetchPosts();
                    } else {
                        showNotification(data.message || 'Could not delete post', 'error');
                    }
                } catch (e) { console.error(e);
                    showNotification('Could not delete post', 'error'); }
            }

            // ----- LIKE / UNLIKE -----
            async function likePost(postId) {
                if (STATE._likeLock.has(postId)) return;
                STATE._likeLock.add(postId);
                try {
                    const res = await fetch(CONFIG.LIKE_URL(postId), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: STATE.sessionUser.id })
                    });
                    const data = await res.json();
                    if (data.success) {
                        await fetchPosts();
                    } else {
                        showNotification(data.message || 'Could not like post', 'error');
                    }
                } catch (e) { console.error(e);
                    showNotification('Could not like post', 'error'); }
                finally { STATE._likeLock.delete(postId); }
            }

            async function unlikePost(postId) {
                if (STATE._likeLock.has(postId)) return;
                STATE._likeLock.add(postId);
                try {
                    const res = await fetch(CONFIG.UNLIKE_URL(postId), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: STATE.sessionUser.id })
                    });
                    const data = await res.json();
                    if (data.success) {
                        await fetchPosts();
                    } else {
                        showNotification(data.message || 'Could not unlike post', 'error');
                    }
                } catch (e) { console.error(e);
                    showNotification('Could not unlike post', 'error'); }
                finally { STATE._likeLock.delete(postId); }
            }

            // ----- COMMENT -----
            async function commentOnPost(postId, comment) {
                const text = comment.trim();
                if (!text) {
                    showNotification('Write a comment first', 'info');
                    return false;
                }
                try {
                    const res = await fetch(CONFIG.COMMENT_URL(postId), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: STATE.sessionUser.id, comment: text })
                    });
                    const data = await res.json();
                    if (!res.ok || !data.success) {
                        showNotification(data.message || 'Could not comment', 'error');
                        return false;
                    }
                    const updated = await fetchPosts();
                    if (!updated) {
                        showNotification('Comment posted, but the feed could not refresh', 'info');
                    } else {
                        showNotification('Comment posted', 'success');
                    }
                    return true;
                } catch (error) {
                    console.error('Comment error:', error);
                    showNotification('Could not post your comment. Please try again.', 'error');
                    return false;
                }
            }

            // ----- VIEW -----
            async function recordView(postId) {
                try {
                    await fetch(CONFIG.VIEW_URL(postId), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: STATE.sessionUser.id })
                    });
                } catch (e) { /* silent */ }
            }

            // ----- GET SINGLE POST (for comments modal) -----
            async function fetchSinglePost(postId) {
                try {
                    const res = await fetch(CONFIG.POST_URL(postId));
                    const data = await res.json();
                    return data.success ? data.post : null;
                } catch (e) { console.error('Fetch single post error:', e); return null; }
            }

            // ============================================================
            //  RENDER POSTS  –  uses data directly from server (already joined)
            // ============================================================
            function renderPosts() {
                const container = DOM.postsContainer;
                const scrollTop = DOM.feedContainer.scrollTop;
                const focusedInput = document.activeElement?.matches('.comment-input-wrap input')
                    ? document.activeElement
                    : null;
                const focusedPostId = focusedInput?.dataset.postid;
                const draft = focusedInput?.value;
                const selectionStart = focusedInput?.selectionStart;
                const selectionEnd = focusedInput?.selectionEnd;
                if (!STATE.posts.length) {
                    container.innerHTML =
                        `<div class="empty-state"><i class="fas fa-newspaper"></i><p>No posts yet. Be the first!</p></div>`;
                    return;
                }
                container.innerHTML = '';

                STATE.posts.forEach(post => {
                    const username = post.username || 'Unknown';
                    const profileImage = post.profile_image || null;
                    const avatarUrl = getAvatarUrl({ profile_image: profileImage });
                    const isLiked = post.likes && post.likes.some(id => String(id) === String(STATE.sessionUser.id));
                    const likeCount = post.likes ? post.likes.length : 0;
                    const commentCount = post.comments ? post.comments.length : 0;
                    const views = post.views || 0;
                    const isOwner = String(post.user_id) === String(STATE.sessionUser.id);

                    let mediaHtml = '';
                    if (post.media_url) {
                        const mediaUrl = escapeHTML(post.media_url);
                        if (post.media_type === 'image') {
                            mediaHtml =
                                `<div class="post-media"><img src="${mediaUrl}" alt="Post image" loading="lazy" /></div>`;
                        } else if (post.media_type === 'video') {
                            mediaHtml = `
                                <div class="post-media">
                                    <video src="${mediaUrl}" preload="metadata" playsinline></video>
                                    <div class="video-placeholder" data-postid="${post.id}">
                                        <i class="fas fa-play-circle"></i>
                                    </div>
                                </div>
                            `;
                        }
                    }

                    let commentsHtml = '';
                    const comments = post.comments || [];
                    const showComments = comments.slice(-2);
                    showComments.forEach(c => {
                        const cUsername = c.username || 'Unknown';
                        const cProfile = c.profile_image || null;
                        const cAvatar = getAvatarUrl({ profile_image: cProfile });
                        commentsHtml += `
                            <div class="comment-item">
                                <div class="c-avatar" style="${cAvatar ? `background-image:url('${escapeHTML(cAvatar)}');` : ''}">${cAvatar ? '' : escapeHTML(getInitials(cUsername))}</div>
                                <div class="c-body"><span class="c-name">${escapeHTML(cUsername)}</span> <span class="c-text">${escapeHTML(c.comment)}</span> <span class="c-time">${timeAgo(c.created_at)}</span></div>
                            </div>
                        `;
                    });
                    if (comments.length > 2) {
                        commentsHtml +=
                            `<div class="view-all-comments" data-postid="${post.id}">View all ${comments.length} comments</div>`;
                    }

                    const card = document.createElement('div');
                    card.className = 'post-card';
                    card.dataset.postid = post.id;
                    card.innerHTML = `
                        <div class="post-header">
                            <div class="ph-avatar" style="${avatarUrl ? `background-image:url('${escapeHTML(avatarUrl)}');` : ''}">${avatarUrl ? '' : escapeHTML(getInitials(username))}</div>
                            <div class="ph-info">
                                <div class="ph-name">${escapeHTML(username)} ${isOwner ? '<span class="ph-badge">You</span>' : ''}</div>
                                <div class="ph-time">${timeAgo(post.created_at)} · ${views} views</div>
                            </div>
                            ${isOwner ? `<button class="ph-more" data-postid="${post.id}"><i class="fas fa-ellipsis-h"></i></button>` : ''}
                        </div>
                        ${mediaHtml}
                        <div class="post-content">${escapeHTML(post.content || '').replace(/\r?\n/g, '<br>')}</div>
                        <div class="post-actions">
                            <button class="${isLiked ? 'liked' : ''}" data-postid="${post.id}" data-action="like"><i class="fas fa-heart"></i> <span class="action-count">${likeCount}</span></button>
                            <button data-postid="${post.id}" data-action="comment"><i class="fas fa-comment"></i> <span class="action-count">${commentCount}</span></button>
                            <button data-postid="${post.id}" data-action="share"><i class="fas fa-share-alt"></i></button>
                        </div>
                        <div class="post-comments">
                            <div class="comment-input-wrap">
                                <input placeholder="Write a comment..." data-postid="${post.id}" />
                                <button data-postid="${post.id}" data-action="comment-submit"><i class="fas fa-paper-plane"></i></button>
                            </div>
                            <div class="comment-list">${commentsHtml}</div>
                        </div>
                    `;
                    container.appendChild(card);

                    const imageEl = card.querySelector('.post-media img');
                    if (imageEl) {
                        imageEl.addEventListener('click', () => openImageViewer(imageEl.src));
                    }

                    // ---- Video click ----
                    const videoEl = card.querySelector('.post-media video');
                    const videoPlaceholder = card.querySelector('.video-placeholder');
                    if (videoEl && videoPlaceholder) {
                        videoEl.addEventListener('loadeddata', () => {
                            videoPlaceholder.classList.add('hidden');
                        });
                        videoEl.addEventListener('error', () => {
                            videoPlaceholder.classList.add('hidden');
                        });

                        const openVideo = () => {
                            if (videoEl.src) openVideoViewer(videoEl.src);
                        };

                        videoEl.addEventListener('click', (e) => {
                            e.stopPropagation();
                            if (videoEl.paused) {
                                videoEl.play().catch(() => {});
                            } else {
                                openVideo();
                            }
                        });
                        videoEl.addEventListener('dblclick', (e) => {
                            e.stopPropagation();
                            openVideo();
                        });
                        videoPlaceholder.addEventListener('click', (e) => {
                            e.stopPropagation();
                            openVideo();
                        });
                    }

                    // ---- Like ----
                    card.querySelector('[data-action="like"]')?.addEventListener('click', function(e) {
                        const btn = e.currentTarget;
                        const pid = btn.dataset.postid;
                        if (btn.classList.contains('liked')) {
                            unlikePost(pid);
                        } else {
                            likePost(pid);
                        }
                    });

                    // ---- Comment button (open modal) ----
                    card.querySelector('[data-action="comment"]')?.addEventListener('click', function(e) {
                        const pid = e.currentTarget.dataset.postid;
                        openCommentsModal(pid);
                    });

                    // ---- View all comments ----
                    card.querySelectorAll('.view-all-comments').forEach(el => {
                        el.addEventListener('click', function() {
                            openCommentsModal(this.dataset.postid);
                        });
                    });

                    // ---- Comment submit ----
                    card.querySelector('[data-action="comment-submit"]')?.addEventListener('click', async function(e) {
                        const btn = e.currentTarget;
                        const pid = btn.dataset.postid;
                        const input = card.querySelector(`input[data-postid="${pid}"]`);
                        if (!input || btn.disabled) return;
                        btn.disabled = true;
                        const posted = await commentOnPost(pid, input.value);
                        btn.disabled = false;
                        if (posted) {
                            const currentInput = DOM.postsContainer.querySelector(
                                `.comment-input-wrap input[data-postid="${CSS.escape(pid)}"]`
                            );
                            if (currentInput) currentInput.value = '';
                        }
                    });

                    card.querySelector('.comment-input-wrap input')?.addEventListener('keydown', async function(e) {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            const input = e.currentTarget;
                            const pid = input.dataset.postid;
                            const submitButton = card.querySelector('[data-action="comment-submit"]');
                            if (!submitButton || submitButton.disabled) return;
                            submitButton.disabled = true;
                            const posted = await commentOnPost(pid, input.value);
                            submitButton.disabled = false;
                            if (posted) {
                                const currentInput = DOM.postsContainer.querySelector(
                                    `.comment-input-wrap input[data-postid="${CSS.escape(pid)}"]`
                                );
                                if (currentInput) currentInput.value = '';
                            }
                        }
                    });

                    // ---- Share ----
                    card.querySelector('[data-action="share"]')?.addEventListener('click', function(e) {
                        const pid = e.currentTarget.dataset.postid;
                        const url = window.location.href + '?post=' + pid;
                        navigator.clipboard.writeText(url)
                            .then(() => showNotification('Link copied!', 'success'))
                            .catch(() => showNotification('Could not copy the post link', 'error'));
                    });

                    // ---- Delete (more) ----
                    card.querySelector('.ph-more')?.addEventListener('click', function(e) {
                        const pid = e.currentTarget.dataset.postid;
                        customConfirm('Delete Post', 'Are you sure you want to delete this post?')
                            .then((ok) => { if (ok) deletePost(pid); });
                    });

                    // ---- View tracking ----
                    const observer = new IntersectionObserver((entries) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                recordView(post.id);
                                observer.disconnect();
                            }
                        });
                    }, { threshold: 0.5 });
                    observer.observe(card);
                });
                if (focusedPostId) {
                    const restoredInput = container.querySelector(
                        `.comment-input-wrap input[data-postid="${CSS.escape(focusedPostId)}"]`
                    );
                    if (restoredInput) {
                        restoredInput.value = draft;
                        restoredInput.focus({ preventScroll: true });
                        if (selectionStart !== null && selectionEnd !== null) {
                            restoredInput.setSelectionRange(selectionStart, selectionEnd);
                        }
                    }
                }
                DOM.feedContainer.scrollTop = scrollTop;
            }

            // ============================================================
            //  COMMENTS MODAL
            // ============================================================
            async function openCommentsModal(postId) {
                try {
                    const post = await fetchSinglePost(postId);
                    const body = DOM.commentsBody;
                    body.innerHTML = '';
                    if (!post) {
                        body.innerHTML = `<div class="empty-comments">Could not load comments</div>`;
                        DOM.commentsModal.classList.add('active');
                        return;
                    }
                    const comments = post.comments || [];
                    if (comments.length === 0) {
                        body.innerHTML = `<div class="empty-comments">No comments yet</div>`;
                    } else {
                        comments.forEach(c => {
                            const cUsername = c.username || 'Unknown';
                            const cProfile = c.profile_image || null;
                            const cAvatar = getAvatarUrl({ profile_image: cProfile });
                            const div = document.createElement('div');
                            div.className = 'cm-item';
                            div.innerHTML = `
                                <div class="cm-avatar" style="${cAvatar ? `background-image:url('${escapeHTML(cAvatar)}');` : ''}">${cAvatar ? '' : escapeHTML(getInitials(cUsername))}</div>
                                <div class="cm-info">
                                    <div class="cm-name">${escapeHTML(cUsername)}</div>
                                    <div class="cm-text">${escapeHTML(c.comment)} <span class="cm-time">${timeAgo(c.created_at)}</span></div>
                                </div>
                            `;
                            body.appendChild(div);
                        });
                    }
                    DOM.commentsModal.classList.add('active');
                } catch (e) {
                    console.error('Comments modal error:', e);
                    DOM.commentsBody.innerHTML = `<div class="empty-comments">Error loading comments</div>`;
                    DOM.commentsModal.classList.add('active');
                }
            }

            DOM.closeCommentsModal.addEventListener('click', () => {
                DOM.commentsModal.classList.remove('active');
            });
            DOM.commentsModal.addEventListener('click', (e) => {
                if (e.target === DOM.commentsModal) DOM.commentsModal.classList.remove('active');
            });

            // ============================================================
            //  NAVIGATION
            // ============================================================
            function switchTab(tabId) {
                if (tabId === 'home') {
                    window.location.href = '/virtual-phone/user/user_phone_dashboard.html';
                    return;
                }
                if (tabId === 'chat') {
                    window.location.href = 'vphone_chat.html';
                    return;
                }
                if (tabId === 'groups') {
                    window.location.href = 'groups.html';
                    return;
                }
                if (tabId === 'profile') {
                    window.location.href = 'profile.html';
                    return;
                }
                // Feed is current
                DOM.bottomNav.querySelectorAll('.nav-item').forEach(item => {
                    item.classList.toggle('active', item.dataset.tab === tabId);
                });
            }

            // ============================================================
            //  DRAGGABLE BELL
            // ============================================================
            function initDraggableBell() {
                const bell = DOM.draggableBell;
                if (!bell) return;
                const bellSize = 38;

                function constrainPosition(x, y) {
                    const screenWidth = DOM.screen.clientWidth;
                    const screenHeight = DOM.screen.clientHeight;
                    const margin = 4;
                    return { x: Math.max(margin, Math.min(x, screenWidth - bellSize - margin)), y: Math.max(margin, Math
                            .min(y, screenHeight - bellSize - margin)) };
                }

                function setBellPosition(x, y) {
                    const pos = constrainPosition(x, y);
                    bell.style.left = pos.x + 'px';
                    bell.style.top = pos.y + 'px';
                }

                function showBell() {
                    bell.style.display = 'flex';
                    STATE.bellVisible = true;
                    const screenWidth = DOM.screen.clientWidth;
                    let x = screenWidth - bellSize - 12,
                        y = 52;
                    const header = document.querySelector('.feed-header');
                    if (header) {
                        const rect = header.getBoundingClientRect();
                        const screenRect = DOM.screen.getBoundingClientRect();
                        x = rect.right - screenRect.left - bellSize - 8;
                        y = rect.top - screenRect.top + 4;
                    }
                    setBellPosition(x, y);
                }

                let isDragging = false,
                    dragStartX = 0,
                    dragStartY = 0;

                bell.addEventListener('mousedown', (e) => {
                    if (e.button !== 0) return;
                    e.preventDefault();
                    const rect = bell.getBoundingClientRect();
                    dragStartX = e.clientX - rect.left;
                    dragStartY = e.clientY - rect.top;
                    isDragging = true;
                    bell.style.cursor = 'grabbing';
                    bell.style.transform = 'scale(0.92)';
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    e.preventDefault();
                    const screenRect = DOM.screen.getBoundingClientRect();
                    const relX = e.clientX - screenRect.left - dragStartX;
                    const relY = e.clientY - screenRect.top - dragStartY;
                    setBellPosition(relX, relY);
                });

                document.addEventListener('mouseup', () => {
                    if (isDragging) {
                        isDragging = false;
                        bell.style.cursor = 'grab';
                        bell.style.transform = '';
                    }
                });

                bell.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    if (!touch) return;
                    const rect = bell.getBoundingClientRect();
                    dragStartX = touch.clientX - rect.left;
                    dragStartY = touch.clientY - rect.top;
                    isDragging = true;
                    bell.style.transform = 'scale(0.92)';
                }, { passive: true });

                document.addEventListener('touchmove', (e) => {
                    if (!isDragging) return;
                    const touch = e.touches[0];
                    if (!touch) return;
                    const screenRect = DOM.screen.getBoundingClientRect();
                    const relX = touch.clientX - screenRect.left - dragStartX;
                    const relY = touch.clientY - screenRect.top - dragStartY;
                    setBellPosition(relX, relY);
                }, { passive: true });

                document.addEventListener('touchend', () => {
                    if (isDragging) {
                        isDragging = false;
                        bell.style.transform = '';
                    }
                }, { passive: true });

                bell.addEventListener('click', (e) => {
                    if (!isDragging) {
                        e.stopPropagation();
                        toggleNotifPanel();
                    }
                });

                const splashObserver = new MutationObserver(() => {
                    if (DOM.splashScreen.classList.contains('hidden')) { showBell();
                        splashObserver.disconnect(); }
                });
                splashObserver.observe(DOM.splashScreen, { attributes: true, attributeFilter: ['class'] });
                if (DOM.splashScreen.classList.contains('hidden')) { showBell(); }
            }

            // ============================================================
            //  POLLING
            // ============================================================
            function startPolling() {
                if (STATE.pollInterval) clearInterval(STATE.pollInterval);
                STATE.pollInterval = setInterval(() => {
                    fetchPosts().catch(() => {});
                }, 5000);
            }

            // ============================================================
            //  INIT
            // ============================================================
            function init() {
                const stored = localStorage.getItem(CONFIG.STORAGE_KEY);
                if (stored) {
                    try {
                        const user = JSON.parse(stored);
                        if (user && user.id) {
                            DOM.splashScreen.classList.remove('hidden');
                            setTimeout(() => {
                                STATE.sessionUser = user;
                                STATE.isLoggedIn = true;
                                DOM.splashScreen.classList.add('hidden');
                                DOM.appContainer.classList.add('active');
                                applyTheme();
                                fetchUsers().then(() => {
                                    fetchPosts();
                                    loadNotifsFromStorage();
                                    updateClock();
                                    setInterval(updateClock, 1000);
                                    initDraggableBell();
                                    renderNotificationPanel();
                                    updateBadge();
                                    startPolling();
                                    showNotification('Welcome to Feed! 📰', 'success');
                                });
                            }, CONFIG.SPLASH_DURATION);
                            return;
                        }
                    } catch (error) { console.error(error); }
                }
                window.location.href = '/virtual-phone/user/user_phone_dashboard.html';
            }

            // ============================================================
            //  EVENT BINDINGS
            // ============================================================
            document.addEventListener('DOMContentLoaded', () => {
                init();

                DOM.postsContainer.addEventListener('click', (event) => {
                    if (event.target.closest('[data-action="retry-feed"]')) fetchPosts();
                });

                // Bottom nav
                DOM.bottomNav.querySelectorAll('.nav-item').forEach(item => {
                    item.addEventListener('click', () => { switchTab(item.dataset.tab); });
                });

                // Theme
                DOM.themeBtn.addEventListener('click', () => {
                    STATE.darkMode = !STATE.darkMode;
                    localStorage.setItem('vphone_theme', STATE.darkMode ? 'dark' : 'light');
                    applyTheme();
                });

                // Create post
                DOM.createPostBtn.addEventListener('click', () => {
                    DOM.createPostModal.classList.add('active');
                    DOM.postContent.focus();
                });

                DOM.postCancelBtn.addEventListener('click', () => {
                    DOM.createPostModal.classList.remove('active');
                    DOM.postContent.value = '';
                    DOM.postMediaPreview.innerHTML = '';
                    DOM.postMediaPreview.style.display = 'none';
                    STATE.postFile = null;
                    DOM.postFileInput.value = '';
                });

                DOM.postMediaBtn.addEventListener('click', () => DOM.postFileInput.click());

                DOM.postFileInput.addEventListener('change', (e) => {
                    const file = e.target.files && e.target.files[0];
                    if (file) {
                        if (!file.type.startsWith('image/') && !file.type.startsWith('video/')) {
                            showNotification('Choose an image or video file', 'error');
                            DOM.postFileInput.value = '';
                            STATE.postFile = null;
                            return;
                        }
                        if (file.size > 50 * 1024 * 1024) {
                            showNotification('Media must be 50 MB or smaller', 'error');
                            DOM.postFileInput.value = '';
                            STATE.postFile = null;
                            return;
                        }
                        STATE.postFile = file;
                        const reader = new FileReader();
                        reader.onload = function(ev) {
                            const preview = DOM.postMediaPreview;
                            preview.style.display = 'block';
                            if (file.type.startsWith('image/')) { preview.innerHTML =
                                    `<img src="${ev.target.result}" />`; } else if (file.type.startsWith(
                                    'video/')) { preview.innerHTML =
                                    `<video src="${ev.target.result}" controls playsinline></video>`; }
                        };
                        reader.readAsDataURL(file);
                    }
                });

                DOM.postSubmitBtn.addEventListener('click', () => {
                    const content = DOM.postContent.value.trim();
                    if (!content && !STATE.postFile) {
                        showNotification('Write something or add media', 'error');
                        return;
                    }
                    createPost(content, STATE.postFile);
                });

                // Notification panel
                DOM.clearNotifBtn.addEventListener('click', async () => {
                    const ok = await customConfirm('Clear notifications', 'Remove all notifications?');
                    if (ok) { clearNotifications(); }
                });

                DOM.panelHandle.addEventListener('mousedown', (e) => {
                    let startY = e.clientY;
                    const onMove = (ev) => {
                        const diff = ev.clientY - startY;
                        if (diff > 40) { toggleNotifPanel(false);
                            document.removeEventListener('mousemove', onMove);
                            document.removeEventListener('mouseup', onUp); }
                    };
                    const onUp = () => { document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onUp); };
                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                });

                DOM.notifOverlay.addEventListener('click', () => { if (STATE.isNotifPanelOpen) toggleNotifPanel(false); });

                // ESC
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        if (STATE.isNotifPanelOpen) toggleNotifPanel(false);
                        if (DOM.createPostModal.classList.contains('active')) DOM.createPostModal.classList.remove(
                            'active');
                        if (DOM.commentsModal.classList.contains('active')) DOM.commentsModal.classList.remove(
                            'active');
                        if (DOM.videoViewer.classList.contains('active')) closeVideoViewer();
                    }
                });

                // Click outside post modal
                DOM.createPostModal.addEventListener('click', (e) => {
                    if (e.target === DOM.createPostModal) {
                        DOM.createPostModal.classList.remove('active');
                        DOM.postContent.value = '';
                        DOM.postMediaPreview.innerHTML = '';
                        DOM.postMediaPreview.style.display = 'none';
                        STATE.postFile = null;
                        DOM.postFileInput.value = '';
                    }
                });
            });

        })();
    </script>

</body>
