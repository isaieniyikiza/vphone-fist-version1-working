<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Feed</title>
    <link rel="stylesheet" href="/virtual-phone/user/settings/theme.css" />
    <script defer src="/virtual-phone/user/settings/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <style>
        /* ===== RESET & BASE ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #eef2f3 0%, #8e9eab 100%);
            overflow: hidden;
            position: relative;
        }

        .phone {
            width: 300px;
            height: 500px;
            background: linear-gradient(180deg, #060606 0%, #121212 100%);
            border-radius: 48px;
            padding: 12px;
            position: relative;
            box-shadow: 0 28px 70px -20px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            user-select: none;
        }

        .screen {
            width: 100%;
            height: 100%;
            border-radius: 36px;
            overflow: hidden;
            position: relative;
            background: #000;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9);
            touch-action: pan-y;
        }

        /* ===== STATUS BAR ===== */
        .status-bar {
            position: absolute;
            top: 12px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            z-index: 900;
        }

        .status-bar .icons {
            display: flex;
            gap: 5px;
        }

        .dynamic-island {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 85px;
            height: 22px;
            background: #000;
            border-radius: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 10px;
            overflow: hidden;
            white-space: nowrap;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .dynamic-island.notify-error {
            width: 220px;
            height: 38px;
            background: #ff3b30;
            border-radius: 19px;
            box-shadow: 0 4px 15px rgba(255, 59, 48, 0.4);
            padding: 0 15px;
            pointer-events: auto;
        }
        .dynamic-island.notify-success {
            width: 220px;
            height: 38px;
            background: #34c759;
            border-radius: 19px;
            box-shadow: 0 4px 15px rgba(52, 199, 89, 0.4);
            padding: 0 15px;
            pointer-events: auto;
        }
        .dynamic-island.notify-info {
            width: 220px;
            height: 38px;
            background: #007aff;
            border-radius: 19px;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
            padding: 0 15px;
            pointer-events: auto;
        }

        .conn-badge {
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 8px;
            color: #f59e0b;
            z-index: 1002;
            pointer-events: none;
        }

        .dock {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 30px;
            z-index: 1001;
            pointer-events: none;
        }

        /* ===== SPLASH ===== */
        .splash-screen {
            position: absolute;
            inset: 0;
            z-index: 20;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 36px;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        .splash-screen.hidden {
            opacity: 0;
        }
        .splash-screen img {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: #fff;
            padding: 8px;
            margin-bottom: 16px;
        }
        .splash-screen p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* ===== APP ===== */
        .app-container {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: none;
            flex-direction: column;
            background: #f8f9fa;
            border-radius: 36px;
            overflow: hidden;
        }
        .app-container.active {
            display: flex;
        }

        /* ===== FEED ===== */
        .feed-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 44px 16px 12px;
            background: #fff;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            position: sticky;
            top: 0;
            z-index: 10;
            flex-shrink: 0;
        }

        .feed-header h1 {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .feed-header .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .feed-header .header-actions button {
            background: none;
            border: none;
            color: #1c1c1e;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 6px;
            position: relative;
        }

        .feed-header .create-btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ===== FEED CONTAINER ===== */
        .feed-container {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0 8px;
            background: #f8f9fa;
            scrollbar-width: thin;
            scrollbar-color: rgba(99, 102, 241, 0.35) transparent;
            overscroll-behavior: contain;
        }
        .feed-container::-webkit-scrollbar {
            width: 3px;
        }
        .feed-container::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 4px;
        }

        /* ===== POST CARD ===== */
        .post-card {
            background: #fff;
            border-radius: 18px;
            margin: 12px 14px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(27, 31, 59, 0.07);
            border: 1px solid rgba(79, 70, 229, 0.08);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .post-card:active {
            transform: scale(0.985);
            box-shadow: 0 4px 14px rgba(27, 31, 59, 0.1);
        }

        .post-card .post-header {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            gap: 10px;
        }

        .post-card .post-header .ph-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #d1d5db;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #1c1c1e;
            font-size: 13px;
        }

        .post-card .post-header .ph-info {
            flex: 1;
            min-width: 0;
        }

        .post-card .post-header .ph-name {
            font-size: 12px;
            font-weight: 600;
            color: #1c1c1e;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .post-card .post-header .ph-name .ph-badge {
            font-size: 9px;
            background: #4f46e5;
            color: #fff;
            padding: 1px 6px;
            border-radius: 999px;
            font-weight: 500;
        }

        .post-card .post-header .ph-time {
            font-size: 10px;
            color: #8e8e93;
        }

        .post-card .post-header .ph-more {
            background: none;
            border: none;
            color: #8e8e93;
            cursor: pointer;
            padding: 4px;
            font-size: 14px;
            border-radius: 50%;
            transition: background 0.15s;
        }
        .post-card .post-header .ph-more:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .post-card .post-content {
            padding: 0 14px 10px;
            font-size: 14px;
            line-height: 1.55;
            color: #1c1c1e;
            word-break: break-word;
        }

        /* ===== POST MEDIA ===== */
        .post-card .post-media {
            width: 100%;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: min(240px, 28vh);
            min-height: 120px;
            overflow: hidden;
            position: relative;
            border-radius: 0;
        }

        .post-card .post-media img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #0a0a0a;
            display: block;
        }

        .post-card .post-media video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #0a0a0a;
            display: block;
            border-radius: 0;
            outline: none;
            cursor: pointer;
        }

        .post-card .post-media video::-webkit-media-controls {
            filter: none;
        }

        .post-card .post-media .video-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 40px;
            pointer-events: none;
            transition: opacity 0.3s;
            cursor: pointer;
        }

        .post-card .post-media .video-placeholder.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* ===== POST ACTIONS ===== */
        .post-card .post-actions {
            display: flex;
            align-items: center;
            padding: 6px 12px 4px;
            gap: 16px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        }

        .post-card .post-actions button {
            background: none;
            border: none;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #1c1c1e;
            cursor: pointer;
            padding: 4px 0;
            font-weight: 500;
            transition: color 0.15s;
        }

        .post-card .post-actions button i {
            font-size: 16px;
            transition: transform 0.15s;
        }

        .post-card .post-actions button:active i {
            transform: scale(0.85);
        }

        .post-card .post-actions button.liked {
            color: #ef4444;
        }

        .post-card .post-actions button.liked i {
            font-weight: 900;
        }

        .post-card .post-actions button .action-count {
            font-size: 11px;
        }

        .post-card .post-stats {
            padding: 4px 12px 0;
            font-size: 11px;
            color: #8e8e93;
            display: flex;
            gap: 12px;
        }
        .post-card .post-stats span {
            cursor: pointer;
        }
        .post-card .post-stats span:hover {
            text-decoration: underline;
        }

        .post-card .post-comments {
            padding: 6px 12px 10px;
        }

        .post-card .post-comments .comment-input-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f1f3f5;
            border-radius: 999px;
            padding: 2px 8px;
            transition: background 0.15s;
        }
        .post-card .post-comments .comment-input-wrap:focus-within {
            background: #e8eaed;
        }

        .post-card .post-comments .comment-input-wrap input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 6px 0;
            outline: none;
            font-size: 11px;
            color: #1c1c1e;
            min-height: 34px;
        }
        .post-card .post-comments .comment-input-wrap input::placeholder {
            color: #9ca3af;
        }

        .post-card .post-comments .comment-input-wrap button {
            background: none;
            border: none;
            color: #4f46e5;
            cursor: pointer;
            font-size: 12px;
            padding: 4px;
            transition: transform 0.15s;
        }

        .post-card .post-actions button {
            min-height: 34px;
        }
        .post-card .post-comments .comment-input-wrap button:active {
            transform: scale(0.9);
        }

        .post-card .post-comments .comment-list {
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .post-card .post-comments .comment-item {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            font-size: 11px;
        }

        .post-card .post-comments .comment-item .c-avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #d1d5db;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 600;
            color: #1c1c1e;
        }

        .post-card .post-comments .comment-item .c-body {
            flex: 1;
            min-width: 0;
        }

        .post-card .post-comments .comment-item .c-name {
            font-weight: 600;
            color: #1c1c1e;
        }

        .post-card .post-comments .comment-item .c-text {
            color: #374151;
        }

        .post-card .post-comments .comment-item .c-time {
            font-size: 9px;
            color: #8e8e93;
            margin-left: 4px;
        }

        .post-card .post-comments .view-all-comments {
            font-size: 11px;
            color: #4f46e5;
            cursor: pointer;
            margin-top: 4px;
            font-weight: 500;
        }
        .post-card .post-comments .view-all-comments:hover {
            text-decoration: underline;
        }

        /* ===== COMMENTS MODAL ===== */
        .comments-modal {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 300;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 36px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .comments-modal.active {
            display: flex;
        }

        .comments-modal .cm-content {
            background: #fff;
            border-radius: 16px;
            width: 100%;
            max-width: 280px;
            max-height: 80%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .comments-modal .cm-content .cm-header {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 14px;
            color: #1c1c1e;
            flex-shrink: 0;
        }

        .comments-modal .cm-content .cm-header button {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: #8e8e93;
            padding: 4px;
        }

        .comments-modal .cm-content .cm-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
        }

        .comments-modal .cm-content .cm-body .cm-item {
            display: flex;
            gap: 8px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        }
        .comments-modal .cm-content .cm-body .cm-item:last-child {
            border-bottom: none;
        }

        .comments-modal .cm-content .cm-body .cm-item .cm-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #d1d5db;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
            color: #1c1c1e;
        }

        .comments-modal .cm-content .cm-body .cm-item .cm-info {
            flex: 1;
        }

        .comments-modal .cm-content .cm-body .cm-item .cm-name {
            font-weight: 600;
            font-size: 12px;
            color: #1c1c1e;
        }

        .comments-modal .cm-content .cm-body .cm-item .cm-text {
            font-size: 12px;
            color: #374151;
        }

        .comments-modal .cm-content .cm-body .cm-item .cm-time {
            font-size: 9px;
            color: #8e8e93;
            margin-left: 4px;
        }

        .comments-modal .cm-content .cm-body .empty-comments {
            text-align: center;
            color: #9ca3af;
            padding: 20px;
            font-size: 13px;
        }

        /* ===== CREATE POST MODAL ===== */
        .create-post-modal {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 250;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 36px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .create-post-modal.active {
            display: flex;
        }

        .create-post-modal .cp-content {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 260px;
            max-height: 80%;
            overflow-y: auto;
        }

        .create-post-modal .cp-content h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            text-align: center;
            color: #1c1c1e;
        }

        .create-post-modal .cp-content textarea {
            width: 100%;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 8px;
            font-size: 12px;
            resize: vertical;
            min-height: 60px;
            outline: none;
            font-family: 'Inter', sans-serif;
            color: #1c1c1e;
            background: #fafafa;
            transition: border-color 0.15s;
        }
        .create-post-modal .cp-content textarea:focus {
            border-color: #4f46e5;
        }

        .create-post-modal .cp-content .cp-media-preview {
            margin: 8px 0;
            max-height: 140px;
            overflow: hidden;
            border-radius: 8px;
            display: none;
            background: #000;
        }

        .create-post-modal .cp-content .cp-media-preview img,
        .create-post-modal .cp-content .cp-media-preview video {
            width: 100%;
            max-height: 140px;
            object-fit: contain;
            display: block;
            background: #000;
        }

        .create-post-modal .cp-content .cp-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .create-post-modal .cp-content .cp-actions button {
            flex: 1;
            padding: 6px 0;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            font-size: 11px;
            cursor: pointer;
            min-width: 50px;
            transition: opacity 0.15s;
        }
        .create-post-modal .cp-content .cp-actions button:active {
            opacity: 0.7;
        }

        .create-post-modal .cp-content .cp-actions .cp-media-btn {
            background: #f1f3f5;
            color: #1c1c1e;
        }

        .create-post-modal .cp-content .cp-actions .cp-submit {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
        }

        .create-post-modal .cp-content .cp-actions .cp-cancel {
            background: #e5e7eb;
            color: #1c1c1e;
        }

        /* ===== CONFIRM MODAL ===== */
        .confirm-modal {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 400;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 36px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .confirm-modal.active {
            display: flex;
        }

        .confirm-modal .confirm-box {
            background: #fff;
            border-radius: 16px;
            padding: 20px 24px;
            max-width: 260px;
            text-align: center;
        }

        .confirm-modal .confirm-box h3 {
            font-size: 16px;
            margin-bottom: 8px;
            color: #111827;
        }

        .confirm-modal .confirm-box p {
            font-size: 13px;
            color: #4b5563;
            margin-bottom: 16px;
        }

        .confirm-modal .confirm-box .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .confirm-modal .confirm-box .buttons button {
            padding: 6px 20px;
            border: none;
            border-radius: 30px;
            font-weight: 500;
            cursor: pointer;
            font-size: 12px;
            transition: opacity 0.15s;
        }
        .confirm-modal .confirm-box .buttons button:active {
            opacity: 0.7;
        }

        .confirm-modal .confirm-box .buttons .confirm-yes {
            background: #ef4444;
            color: #fff;
        }

        .confirm-modal .confirm-box .buttons .confirm-no {
            background: #e5e7eb;
            color: #111827;
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            display: flex;
            background: #fff;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            padding: 4px 0 8px;
            flex-shrink: 0;
            z-index: 50;
            position: relative;
        }

        .bottom-nav .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 4px 0;
            color: #8e8e93;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s;
            border: none;
            background: none;
            position: relative;
        }

        .bottom-nav .nav-item i {
            font-size: 20px;
        }

        .bottom-nav .nav-item.active {
            color: #4f46e5;
        }

        .bottom-nav .nav-item .badge {
            position: absolute;
            top: 0;
            right: 50%;
            transform: translateX(18px);
            background: #ef4444;
            color: #fff;
            font-size: 8px;
            font-weight: 700;
            border-radius: 50%;
            min-width: 16px;
            height: 16px;
            display: none;
            align-items: center;
            justify-content: center;

    <!-- ===== PHONE ===== -->
    <div class="phone" id="phone">
        <div class="screen" id="screen">
