<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6fb" />
    <title>Notes · Virtual Phone</title>
    <link rel="stylesheet" href="/virtual-phone/user/settings/theme.css" />
    <script defer src="/virtual-phone/user/settings/theme.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: #f4f6fb; color: #172033; font: 15px/1.5 system-ui, sans-serif; }
        .app { width: min(100%, 620px); min-height: 100vh; margin: auto; padding: 18px; background: #fff; }
        header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        header h1 { flex: 1; margin: 0; font-size: 22px; }
        .home, button { min-height: 42px; border: 0; border-radius: 12px; font: inherit; cursor: pointer; }
        .home { display: grid; width: 42px; place-items: center; background: #eef2f8; color: #172033; text-decoration: none; }
        .editor { display: grid; gap: 10px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #dce2ed; border-radius: 12px; background: #fbfcfe; color: inherit; font: inherit; }
        textarea { min-height: 150px; resize: vertical; }
        .save { background: #1473e6; color: white; font-weight: 650; }
        .new { padding: 0 14px; background: #eef2f8; color: #172033; }
        .actions { display: flex; gap: 8px; }
        .actions .save { flex: 1; }
        #status { min-height: 22px; margin: 8px 0; color: #566176; font-size: 13px; }
        .notes { display: grid; gap: 8px; padding: 0; list-style: none; }
        .note { display: flex; align-items: stretch; gap: 8px; padding: 10px; border: 1px solid #e6eaf1; border-radius: 13px; }
        .open-note { flex: 1; min-width: 0; padding: 4px; background: transparent; color: inherit; text-align: left; }
        .open-note strong, .open-note span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .open-note span { color: #697386; font-size: 13px; }
        .delete-note { padding: 0 12px; background: #fff0ef; color: #b42318; }
        .empty { color: #697386; text-align: center; padding: 20px; }
        @media (max-width: 400px) { .app { padding: 14px; } }
    </style>
</head>
<body>
    <main class="app">
        <header>
            <a class="home" href="/virtual-phone/user/user_phone_dashboard.html" aria-label="Return to phone home"><i class="fa-solid fa-house"></i></a>
            <h1>Notes</h1>
            <button class="new" id="newNote" type="button">New note</button>
        </header>
        <form class="editor" id="noteForm">
            <input id="noteTitle" type="text" maxlength="120" placeholder="Note title" aria-label="Note title" required />
            <textarea id="noteBody" maxlength="10000" placeholder="Write your note..." aria-label="Note text" required></textarea>
            <div class="actions">
                <button class="save" type="submit">Save note</button>
            </div>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
        <ul class="notes" id="notesList" aria-label="Saved notes"></ul>
    </main>
    <script>
        (() => {
            const form = document.getElementById('noteForm');
            const titleInput = document.getElementById('noteTitle');
            const bodyInput = document.getElementById('noteBody');
            const list = document.getElementById('notesList');
            const status = document.getElementById('status');
            let userKey = 'guest';
            try {
                const user = JSON.parse(localStorage.getItem('vphone_user') || 'null');
                if (user && user.id) userKey = String(user.id);
            } catch {
                status.textContent = 'Could not read the current phone account. Notes are saved for this browser.';
            }
            const storageKey = `vphone_notes_${userKey}`;
            let notes = [];
            let editingId = null;

            function saveNotes() {
                try {
                    localStorage.setItem(storageKey, JSON.stringify(notes));
                    status.textContent = 'Saved on this device.';
                    return true;
                } catch {
                    status.textContent = 'Could not save this note. Check available browser storage.';
                    return false;
                }
            }

            function renderNotes() {
                list.replaceChildren();
                if (!notes.length) {
                    const empty = document.createElement('li');
                    empty.className = 'empty';
                    empty.textContent = 'Your saved notes will appear here.';
                    list.append(empty);
                    return;
                }
                for (const note of notes) {
                    const item = document.createElement('li');
                    item.className = 'note';
                    const open = document.createElement('button');
                    open.type = 'button';
                    open.className = 'open-note';
                    const title = document.createElement('strong');
                    title.textContent = note.title;
                    const preview = document.createElement('span');
                    preview.textContent = note.body;
                    open.append(title, preview);
                    open.addEventListener('click', () => {
                        editingId = note.id;
                        titleInput.value = note.title;
                        bodyInput.value = note.body;
                        titleInput.focus();
                    });
                    const remove = document.createElement('button');
                    remove.type = 'button';
                    remove.className = 'delete-note';
                    remove.setAttribute('aria-label', `Delete ${note.title}`);
                    remove.innerHTML = '<i class="fa-solid fa-trash" aria-hidden="true"></i>';
                    remove.addEventListener('click', () => {
                        notes = notes.filter(saved => saved.id !== note.id);
                        if (editingId === note.id) resetEditor();
                        saveNotes();
                        renderNotes();
                    });
                    item.append(open, remove);
                    list.append(item);
                }
            }

            function resetEditor() {
                editingId = null;
                form.reset();
            }

            try {
                const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
                notes = Array.isArray(saved)
                    ? saved.filter(note => note && typeof note.id === 'string'
                        && typeof note.title === 'string' && typeof note.body === 'string')
                    : [];
            } catch {
                status.textContent = 'Saved notes could not be read. You can still create new notes.';
            }

            form.addEventListener('submit', event => {
                event.preventDefault();
                const title = titleInput.value.trim();
                const body = bodyInput.value.trim();
                if (!title || !body) {
                    status.textContent = 'Enter a title and note text before saving.';
                    return;
                }
                if (editingId) {
                    const note = notes.find(saved => saved.id === editingId);
                    if (note) {
                        note.title = title;
                        note.body = body;
                        note.updatedAt = Date.now();
                    }
                } else {
                    notes.unshift({ id: `${Date.now()}-${Math.random().toString(36).slice(2)}`, title, body, updatedAt: Date.now() });
                }
                if (saveNotes()) {
                    resetEditor();
                    renderNotes();
                }
            });
            document.getElementById('newNote').addEventListener('click', () => {
                resetEditor();
                titleInput.focus();
                status.textContent = '';
            });
            renderNotes();
        })();
    </script>
</body>
</html>
