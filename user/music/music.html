<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Music · Virtual Phone</title>
    <link rel="stylesheet" href="/virtual-phone/user/settings/theme.css" />
    <script defer src="/virtual-phone/user/settings/theme.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        :root { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: #f7f8ff; background: #101323; }
        body { margin: 0; min-height: 100vh; min-height: 100dvh; background: radial-gradient(ellipse at 50% -18%, #463784 0%, #171a31 42%, #101323 78%); }
        .app { width: min(100%, 560px); min-height: 100vh; min-height: 100dvh; margin: auto; padding: 18px 17px 190px; }
        header { display: flex; align-items: center; gap: 12px; }
        .brand { width: 43px; height: 43px; display: grid; place-items: center; border-radius: 15px; color: #fff; background: linear-gradient(145deg, #ff3b64, #da2451); box-shadow: 0 8px 20px #e92c5a45; font-size: 19px; }
        h1 { flex: 1; margin: 0; font-size: 20px; letter-spacing: -.5px; }
        .home { display: grid; width: 36px; height: 36px; place-items: center; border: 1px solid #ffffff20; border-radius: 12px; color: #fff; text-decoration: none; background: #ffffff0d; }
        html.embedded-app .home { display: none; }
        .hero { position: relative; overflow: hidden; min-height: 132px; display: flex; flex-direction: column; justify-content: flex-end; margin: 22px 0 18px; padding: 19px; border: 1px solid #ffffff17; border-radius: 22px; background: linear-gradient(125deg,#603d9d,#e63769 115%); box-shadow: 0 15px 34px #06071055; }
        .hero::after { content: "\f001"; position: absolute; top: -12px; right: 4px; color: #ffffff1b; font: 104px "Font Awesome 6 Free"; font-weight: 900; transform: rotate(12deg); }
        .hero small { position: relative; z-index: 1; margin-bottom: 5px; color: #f3dffc; font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; }
        .hero h2 { position: relative; z-index: 1; max-width: 240px; margin: 0; font-size: 20px; line-height: 1.2; }
        .hero p { position: relative; z-index: 1; margin: 7px 0 0; color: #f7eafa; font-size: 11px; }
        .search { display: flex; align-items: center; gap: 9px; height: 42px; margin-bottom: 19px; padding: 0 12px; border: 1px solid #ffffff15; border-radius: 13px; color: #aeb3cc; background: #ffffff0b; }
        .search input { width: 100%; border: 0; outline: 0; color: #fff; background: transparent; font: inherit; font-size: 12px; }
        .search input::placeholder { color: #9da2ba; }
        .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 1px 11px; }
        .section-heading h2 { margin: 0; font-size: 14px; }
        .library-actions { display: flex; align-items: center; gap: 8px; }
        .section-heading span { color: #a0a5bc; font-size: 10px; }
        .refresh-library { padding: 6px 9px; border: 1px solid #ffffff20; border-radius: 9px; color: #dce1f2; background: #ffffff0b; font: inherit; font-size: 10px; cursor: pointer; }
        .tracks { display: grid; gap: 8px; }
        .track { width: 100%; display: flex; align-items: center; gap: 11px; padding: 10px; border: 1px solid #ffffff12; border-radius: 14px; color: inherit; background: #ffffff08; text-align: left; cursor: pointer; transition: background .16s, transform .16s; }
        .track:hover, .track.playing { background: #ffffff13; }
        .track:active { transform: scale(.99); }
        .cover { width: 43px; height: 43px; flex: none; display: grid; place-items: center; border-radius: 12px; color: #fff; background: linear-gradient(145deg,#623fc4,#f43f70); font-size: 15px; }
        .track:nth-child(3n + 2) .cover { background: linear-gradient(145deg,#087e8b,#41c9a8); }
        .track:nth-child(3n) .cover { background: linear-gradient(145deg,#d47124,#f1b544); }
        .track-info { flex: 1; min-width: 0; }
        .track-info strong { display: block; overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
        .track-info span { display: block; margin-top: 4px; color: #a4a9bf; font-size: 9px; }
        .play-icon { width: 29px; height: 29px; display: grid; flex: none; place-items: center; border-radius: 50%; color: #ff6b8a; background: #ff50701a; font-size: 11px; }
        .status { padding: 20px 13px; border: 1px dashed #ffffff20; border-radius: 14px; color: #b6bbd1; font-size: 11px; line-height: 1.5; text-align: center; }
        .status a { color: #ff809a; font-weight: 700; text-decoration: none; }
        .player { position: fixed; right: 0; bottom: 0; left: 0; z-index: 2; padding: 13px max(16px, calc((100% - 526px) / 2)) calc(13px + env(safe-area-inset-bottom)); border-top: 1px solid #ffffff18; background: #17192bf2; box-shadow: 0 -12px 30px #090a1455; backdrop-filter: blur(18px); }
        .now-playing { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
        .now-playing .cover { width: 38px; height: 38px; border-radius: 11px; }
        .now-info { flex: 1; min-width: 0; }
        .now-info strong { display: block; overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
        .now-info span { display: block; margin-top: 3px; color: #a4a9bf; font-size: 9px; }
        .player audio { display: block; width: 100%; height: 38px; }
        .player audio::-webkit-media-controls-panel { background: #f4f4f7; }
        .notice { margin-top: 8px; color: #ff9aab; font-size: 10px; }
        @media(min-width: 561px) { .player { border-right: 1px solid #ffffff12; border-left: 1px solid #ffffff12; } }
        @media(prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
    </style>
    <script>
        if (new URLSearchParams(window.location.search).get('embedded') === '1') {
            document.documentElement.classList.add('embedded-app');
        }
    </script>
</head>
<body>
<main class="app">
    <header>
        <div class="brand"><i class="fa-solid fa-music"></i></div>
        <h1>Music</h1>
        <a class="home" href="/virtual-phone/user/user_phone_dashboard.html" aria-label="Back to phone home" title="Phone home"><i class="fa-solid fa-house"></i></a>
    </header>
    <section class="hero">
        <small>Your library</small>
        <h2>Soundtrack your day.</h2>
        <p>Play audio saved in your Virtual Phone storage.</p>
    </section>
    <label class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="search" type="search" placeholder="Search your music" aria-label="Search music"></label>
    <div class="section-heading"><h2>Music in File Manager</h2><div class="library-actions"><span id="trackCount">Loading…</span><button class="refresh-library" id="refreshLibrary" type="button" aria-label="Refresh music library"><i class="fa-solid fa-rotate"></i></button></div></div>
    <section class="tracks" id="tracks" aria-live="polite"><div class="status">Loading your music…</div></section>
</main>
<aside class="player" aria-label="Music player">
    <div class="now-playing">
        <div class="cover"><i class="fa-solid fa-music"></i></div>
        <div class="now-info"><strong id="nowTitle">Choose a track</strong><span id="nowSubtitle">Your audio files appear here</span></div>
    </div>
    <audio id="audioPlayer" controls preload="metadata"></audio>
    <div class="notice" id="notice" role="status" aria-live="polite"></div>
</aside>
<script>
(() => {
    const tracksElement = document.getElementById('tracks');
    const countElement = document.getElementById('trackCount');
    const search = document.getElementById('search');
    const player = document.getElementById('audioPlayer');
    const nowTitle = document.getElementById('nowTitle');
    const nowSubtitle = document.getElementById('nowSubtitle');
    const notice = document.getElementById('notice');
    const refreshButton = document.getElementById('refreshLibrary');
    let tracks = [];
    let currentIndex = -1;
    let requestId = 0;
    const AUDIO_EXTENSIONS = new Set([
        'mp3', 'wav', 'flac', 'aac', 'ogg', 'wma', 'm4a', 'opus', 'amr', 'aiff', 'aif', 'm4b'
    ]);

    function isAudioFile(file) {
        const extension = String(file.name || '').split('.').pop().toLowerCase();
        return file.type === 'audio' || AUDIO_EXTENSIONS.has(extension) ||
            String(file.mime || '').toLowerCase().startsWith('audio/');
    }

    function setLoading(loading) {
        refreshButton.disabled = loading;
        refreshButton.innerHTML = loading
            ? '<i class="fa-solid fa-spinner fa-spin"></i>'
            : '<i class="fa-solid fa-rotate"></i>';
        refreshButton.setAttribute('aria-busy', String(loading));
    }

    function showStatus(text, allowStorageLink = false) {
        const status = document.createElement('div');
        status.className = 'status';
        status.append(document.createTextNode(text));
        if (allowStorageLink) {
            status.append(document.createTextNode(' Upload audio in '));
            const link = document.createElement('a');
            link.href = '/virtual-phone/user/storage/store.html';
            link.textContent = 'File Manager';
            status.append(link, document.createTextNode(' to get started.'));
        }
        tracksElement.replaceChildren(status);
    }

    async function loadTracks() {
        const thisRequest = ++requestId;
        setLoading(true);
        countElement.textContent = 'Loading…';
        showStatus('Loading music from your File Manager…');
        try {
            const response = await fetch('/virtual-phone/user/storage/api/list.php', { credentials: 'same-origin' });
            const data = await response.json();
            if (!response.ok || !data.success) {
                if (response.status === 401) throw new Error('Sign in to your Virtual Phone to access your music.');
                throw new Error(data.message || 'Could not load your audio files.');
            }
            if (thisRequest !== requestId) return;
            tracks = (Array.isArray(data.files) ? data.files : [])
                .filter(isAudioFile)
                .map(file => ({ ...file, name: String(file.name || 'Audio track') }));
            if (currentIndex >= tracks.length) {
                currentIndex = -1;
                player.pause();
                player.removeAttribute('src');
                player.load();
                nowTitle.textContent = 'Choose a track';
                nowSubtitle.textContent = 'Your audio files appear here';
            }
            render();
        } catch (error) {
            if (thisRequest !== requestId) return;
            countElement.textContent = 'Unavailable';
            showStatus(error.message || 'Could not connect to your music library.');
        } finally {
            if (thisRequest === requestId) setLoading(false);
        }
    }

    function render() {
        const query = search.value.trim().toLowerCase();
        const visible = tracks.filter(track => track.name.toLowerCase().includes(query));
        countElement.textContent = `${visible.length} ${visible.length === 1 ? 'track' : 'tracks'}`;
        if (!visible.length) {
            showStatus(tracks.length
                ? 'No music matches your search.'
                : 'There isn’t any music in your File Manager yet.', !tracks.length);
            return;
        }
        tracksElement.replaceChildren();
        visible.forEach(track => {
            const originalIndex = tracks.indexOf(track);
            const button = document.createElement('button');
            button.type = 'button';
            button.className = `track${originalIndex === currentIndex ? ' playing' : ''}`;
            const cover = document.createElement('span');
            cover.className = 'cover';
            cover.innerHTML = '<i class="fa-solid fa-music"></i>';
            const info = document.createElement('span');
            info.className = 'track-info';
            const name = document.createElement('strong');
            name.textContent = track.name;
            const size = document.createElement('span');
            size.textContent = formatBytes(track.size);
            info.append(name, size);
            const play = document.createElement('span');
            play.className = 'play-icon';
            play.innerHTML = `<i class="fa-solid ${originalIndex === currentIndex && !player.paused ? 'fa-pause' : 'fa-play'}"></i>`;
            button.append(cover, info, play);
            button.addEventListener('click', () => playTrack(originalIndex));
            tracksElement.append(button);
        });
    }

    function formatBytes(bytes) {
        const value = Number(bytes) || 0;
        if (value < 1024) return `${value} B`;
        const units = ['KB', 'MB', 'GB'];
        const exponent = Math.min(Math.floor(Math.log(value) / Math.log(1024)), units.length);
        return `${(value / Math.pow(1024, exponent)).toFixed(1)} ${units[exponent - 1]}`;
    }

    async function playTrack(index) {
        const track = tracks[index];
        if (!track) return;
        currentIndex = index;
        nowTitle.textContent = track.name;
        nowSubtitle.textContent = `${index + 1} of ${tracks.length} · ${formatBytes(track.size)}`;
        notice.textContent = '';
        player.src = `/virtual-phone/user/storage/api/download.php?id=${encodeURIComponent(track.id)}`;
        render();
        try {
            await player.play();
        } catch (error) {
            notice.textContent = 'Playback could not start. Tap the player controls to try again.';
        }
    }

    player.addEventListener('ended', () => {
        if (currentIndex >= 0 && currentIndex + 1 < tracks.length) playTrack(currentIndex + 1);
    });
    player.addEventListener('play', render);
    player.addEventListener('pause', render);
    search.addEventListener('input', render);
    refreshButton.addEventListener('click', loadTracks);
    loadTracks();
})();
</script>
</body>
</html>
