<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EditPro Studio</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><button id="back" hidden aria-label="Back">‹</button><b id="ttl">EditPro Studio</b></header>
<main>
<section id="v-home" class="view home">
  <p class="lead">What are we editing?</p>
  <button class="tile t1" data-go="photo"><b>Photo</b><small>Filters, crop, text, stickers</small></button>
  <button class="tile t2" data-go="video"><b>Video</b><small>Trim, speed, look, captions</small></button>
  <button class="tile t3" data-go="music"><b>Music</b><small>Waveform, trim, fades, record</small></button>
  <p class="note">Everything runs on your phone. Nothing is uploaded.</p>
</section>

<section id="v-photo" class="view" hidden>
  <div class="stage"><canvas id="pc"></canvas><p class="empty" id="pe">Choose a photo to start</p></div>
  <div class="bar"><label class="btn pri">Open photo<input id="pf" type="file" accept="image/*" hidden></label><button class="btn" id="pr">Reset</button></div>
  <div id="ptools"></div>
</section>

<section id="v-video" class="view" hidden>
  <div class="stage"><video id="vid" playsinline></video><div id="vtx"></div><p class="empty" id="ve">Choose a video to start</p></div>
  <div class="bar"><button class="btn" id="vp">▶</button><input id="vs" type="range" min="0" max="1" step="0.05" value="0"><span id="vt2">0:00</span></div>
  <div id="trk"><i></i><b></b></div>
  <div class="bar"><label class="btn pri">Open video<input id="vf" type="file" accept="video/*" hidden></label><button class="btn" id="vx">Export</button></div>
  <div id="vtools"></div>
</section>

<section id="v-music" class="view" hidden>
  <div class="stage wave"><canvas id="wc"></canvas><p class="empty" id="me">Open or record audio to start</p></div>
  <div class="bar"><label class="btn pri">Open audio<input id="mf" type="file" accept="audio/*" hidden></label><button class="btn" id="mp">▶ Preview</button></div>
  <div id="mtools"></div>
</section>
</main>
<div id="toast"></div>
<script src="js/app.js"></script>
</body></html>
