<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Play Store · Virtual Phone</title>
    <link rel="stylesheet" href="/virtual-phone/user/settings/theme.css" />
    <script defer src="/virtual-phone/user/settings/theme.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: #20243a; background: #f5f6fb; }
        body { margin: 0; height: 100vh; height: 100dvh; overflow: hidden; background: #f5f6fb; }
        .store { height: 100%; display: flex; flex-direction: column; }
        .topbar { flex: none; padding: 17px 18px 12px; background: #fff; border-bottom: 1px solid #eceef5; }
        .heading { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
        .store-mark { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 12px; background: #eef0ff; color: #5865f2; font-size: 17px; }
        h1 { margin: 0; font-size: 19px; letter-spacing: -.4px; }
        .standalone-home { margin-left: auto; display: none; color: #5965e9; text-decoration: none; font-size: 12px; font-weight: 700; }
        html:not(.embedded-app) .standalone-home { display: inline-flex; }
        .searchbox { display: flex; align-items: center; gap: 9px; height: 42px; padding: 0 12px; border: 1px solid #e6e8f0; border-radius: 13px; background: #f6f7fb; color: #7d8499; }
        .searchbox input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: #20243a; font: inherit; font-size: 13px; }
        .searchbox input::placeholder { color: #9ba1b1; }
        main { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 24px; scrollbar-width: thin; }
        .welcome { position: relative; overflow: hidden; margin-bottom: 16px; padding: 17px; border-radius: 18px; color: #fff; background: linear-gradient(130deg,#5865f2,#8b5cf6); }
        .welcome::after { content: "\f7b6"; position: absolute; right: 12px; bottom: -19px; color: #ffffff21; font: 76px "Font Awesome 6 Free"; font-weight: 900; }
        .welcome h2 { position: relative; z-index: 1; margin: 0 0 5px; font-size: 17px; }
        .welcome p { position: relative; z-index: 1; max-width: 210px; margin: 0; color: #ecebff; font-size: 11px; line-height: 1.5; }
        .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 17px 1px 9px; }
        .section-head h2 { margin: 0; font-size: 14px; }
        .section-head span { color: #9298a9; font-size: 10px; }
        .filters { display: flex; gap: 7px; margin-bottom: 11px; }
        .filter { border: 1px solid #e5e7f0; border-radius: 99px; padding: 7px 11px; color: #6e7488; background: white; font: inherit; font-size: 10px; cursor: pointer; }
        .filter.active { border-color: #5865f2; color: #fff; background: #5865f2; }
        .grid { display: grid; gap: 9px; }
        .card { display: grid; grid-template-columns: 46px minmax(0,1fr) auto; align-items: center; gap: 10px; min-height: 71px; padding: 10px; border: 1px solid #eceef4; border-radius: 15px; background: #fff; box-shadow: 0 5px 16px #28345a08; }
        .icon { width: 44px; height: 44px; border-radius: 13px; object-fit: cover; background: #eef0ff; }
        .app-title { min-width: 0; font-size: 12px; font-weight: 750; line-height: 1.3; overflow-wrap: anywhere; }
        .slug { display: block; margin-top: 3px; color: #9298a9; font-size: 9px; font-weight: 500; }
        .description { display: -webkit-box; overflow: hidden; margin: 5px 0 0; color: #7b8294; font-size: 10px; line-height: 1.35; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .action { min-width: 66px; position: relative; overflow: hidden; border: 0; border-radius: 10px; padding: 9px 10px; color: #4b58df; background: #eef0ff; font: inherit; font-size: 10px; font-weight: 750; cursor: pointer; }
        .action.open { color: white; background: #5865f2; }
        .action:disabled { cursor: wait; opacity: .8; }
        .install-progress { position: absolute; inset: auto auto 0 0; height: 3px; width: 0; background: #9a8cff; }
        .action.installing .install-progress { width: 100%; transition: width 1.5s cubic-bezier(.15,.7,.2,1); }
        .status { padding: 19px 12px; border: 1px dashed #dfe2ed; border-radius: 14px; color: #7d8498; background: #fff; font-size: 11px; text-align: center; }
        .message { margin-bottom: 10px; padding: 10px 11px; border-radius: 11px; color: #9d392e; background: #fff0ed; font-size: 11px; }
        .toast { position: fixed; z-index: 5; right: 12px; bottom: 14px; left: 12px; padding: 11px 14px; border-radius: 12px; color: white; background: #252a40; box-shadow: 0 8px 22px #11182730; font-size: 11px; opacity: 0; transform: translateY(8px); transition: .2s ease; pointer-events: none; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .splash { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; background: #f5f6fb; transition: opacity .25s ease, visibility .25s ease; }
        .splash.hidden { visibility: hidden; opacity: 0; }
        .splash-content { display: grid; justify-items: center; gap: 12px; color: #788096; font-size: 11px; }
        .splash-icon { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 19px; color: white; background: linear-gradient(145deg,#5865f2,#a855f7); box-shadow: 0 9px 24px #5865f244; font-size: 24px; animation: pulse 1s ease-in-out infinite alternate; }
        .dots::after { content: ""; animation: dots 1.2s steps(4,end) infinite; }
        @keyframes pulse { to { transform: scale(1.07); } }
        @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75%,100% { content: "..."; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
    <script>
        if (new URLSearchParams(window.location.search).get('embedded') === '1') {
            document.documentElement.classList.add('embedded-app');
        }
    </script>
</head>
<body>
<div class="store">
    <header class="topbar">
        <div class="heading">
            <div class="store-mark"><i class="fa-solid fa-store"></i></div>
            <h1>Play Store</h1>
            <a class="standalone-home" href="/virtual-phone/user/user_phone_dashboard.html">Phone home</a>
        </div>
        <label class="searchbox"><i class="fa-solid fa-magnifying-glass"></i><input id="search" type="search" placeholder="Search apps" aria-label="Search apps" autocomplete="off"></label>
    </header>
    <main>
        <section class="welcome"><h2>Make it your phone</h2><p>Discover apps made for your Virtual Phone and install your favorites.</p></section>
        <div id="message" aria-live="polite"></div>
        <div class="section-head"><h2>Explore apps</h2><span id="appCount"></span></div>
        <div class="filters" role="group" aria-label="Filter apps">
            <button type="button" class="filter active" data-filter="all">All apps</button>
            <button type="button" class="filter" data-filter="installed">Installed</button>
        </div>
        <section class="grid" id="appGrid" aria-live="polite"><div class="status">Getting the store ready…</div></section>
    </main>
</div>
<div class="splash" id="splash" aria-label="Loading Play Store">
    <div class="splash-content"><div class="splash-icon"><i class="fa-solid fa-store"></i></div><strong>Opening Play Store<span class="dots"></span></strong></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
    const grid = document.getElementById('appGrid');
    const message = document.getElementById('message');
    const search = document.getElementById('search');
    const count = document.getElementById('appCount');
    const toast = document.getElementById('toast');
    let apps = [];
    let activeFilter = 'all';
    let toastTimer;

    function showError(text) {
        message.className = 'message';
        message.textContent = text;
    }

    function showToast(text) {
        toast.textContent = text;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    async function load() {
        try {
            const response = await fetch('/virtual-phone/user/apps/api/catalog.php', { credentials: 'same-origin' });
            const data = await response.json();
            if (!response.ok || !data.success) throw new Error(data.message || 'Could not load the app catalog.');
            apps = data.apps || [];
            render();
        } catch (error) {
            grid.replaceChildren();
            const status = document.createElement('div');
            status.className = 'status';
            status.textContent = error.message || 'Could not connect to the app catalog.';
            grid.append(status);
        } finally {
            setTimeout(() => document.getElementById('splash').classList.add('hidden'), 500);
        }
    }

    function render() {
        const query = search.value.trim().toLowerCase();
        const visible = apps.filter(app => {
            const matchesQuery = `${app.name} ${app.slug} ${app.description || ''}`.toLowerCase().includes(query);
            return matchesQuery && (activeFilter !== 'installed' || Number(app.installed) === 1);
        });
        count.textContent = `${visible.length} ${visible.length === 1 ? 'app' : 'apps'}`;
        grid.replaceChildren();
        if (!visible.length) {
            const status = document.createElement('div');
            status.className = 'status';
            status.textContent = activeFilter === 'installed' ? 'No installed apps yet. Browse all apps to get started.' :
                (apps.length ? 'No apps match your search.' : 'No apps have been published yet. Check back later.');
            grid.append(status);
            return;
        }

        for (const app of visible) {
            const card = document.createElement('article');
            card.className = 'card';
            const icon = document.createElement('img');
            icon.className = 'icon';
            icon.src = app.icon_path;
            icon.alt = '';
            icon.loading = 'lazy';
            icon.onerror = () => {
                icon.onerror = null;
                icon.src = 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" rx="18" fill="%23eef0ff"/%3E%3Cpath d="M22 18h20v28H22z" fill="%235865f2"/%3E%3C/svg%3E';
            };
            const info = document.createElement('div');
            info.className = 'app-title';
            info.textContent = app.name;
            const slug = document.createElement('span');
            slug.className = 'slug';
            slug.textContent = app.slug;
            const description = document.createElement('p');
            description.className = 'description';
            description.textContent = app.description || 'A new app for your Virtual Phone.';
            info.append(slug, description);
            const button = document.createElement('button');
            button.type = 'button';
            button.className = `action${Number(app.installed) === 1 ? ' open' : ''}`;
            button.innerHTML = `${Number(app.installed) === 1 ? 'Open' : 'Install'}<span class="install-progress"></span>`;
            button.addEventListener('click', () => Number(app.installed) === 1 ? openApp(app.id) : installApp(app, button));
            card.append(icon, info, button);
            grid.append(card);
        }
    }

    function openApp(id) {
        window.location.href = `/virtual-phone/user/apps/runtime.php?id=${encodeURIComponent(id)}`;
    }

    async function installApp(app, button) {
        button.disabled = true;
        button.innerHTML = 'Installing…<span class="install-progress"></span>';
        button.classList.add('installing');
        const startedAt = Date.now();
        try {
            const [response] = await Promise.all([
                fetch('/virtual-phone/user/apps/api/installed.php', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ app_id: app.id })
                }),
                new Promise(resolve => setTimeout(resolve, 1350))
            ]);
            const data = await response.json();
            if (!response.ok || !data.success) throw new Error(data.message || 'Could not install this app.');
            if (Date.now() - startedAt < 1350) await new Promise(resolve => setTimeout(resolve, 1350 - (Date.now() - startedAt)));
            app.installed = 1;
            message.className = '';
            message.textContent = '';
            render();
            showToast(`${app.name} is ready to use.`);
        } catch (error) {
            button.classList.remove('installing');
            button.disabled = false;
            button.textContent = 'Try again';
            showError(error.message || 'Could not install this app.');
        }
    }

    search.addEventListener('input', render);
    document.querySelectorAll('.filter').forEach(button => button.addEventListener('click', () => {
        activeFilter = button.dataset.filter;
        document.querySelectorAll('.filter').forEach(filter => filter.classList.toggle('active', filter === button));
        render();
    }));
    load();
})();
</script>
</body>
</html>
