<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Manager · Virtual Phone</title>
    <link rel="stylesheet" href="/virtual-phone/user/settings/theme.css" />
    <script defer src="/virtual-phone/user/settings/theme.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        *{box-sizing:border-box}body{margin:0;height:100vh;height:100dvh;overflow:hidden;background:#f5f6fb;color:#20243a;font:13px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
        .manager{height:100%;display:flex;flex-direction:column}
        header{display:flex;align-items:center;gap:10px;padding:17px 16px 14px;background:#fff;border-bottom:1px solid #eceef5}
        .mark{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:#eef0ff;color:#5865f2;font-size:16px}header h1{font-size:18px;margin:0;flex:1}
        .home{display:none;color:#5965e9;text-decoration:none;font-size:11px;font-weight:700}html:not(.embedded-app) .home{display:inline}
        main{flex:1;min-height:0;overflow-y:auto;padding:17px 16px 24px}.intro{margin-bottom:17px}.intro h2{margin:0 0 5px;font-size:15px}.intro p{margin:0;color:#778196;font-size:11px;line-height:1.45}
        .list{display:grid;gap:10px}.row{display:flex;align-items:center;gap:11px;padding:11px;background:#fff;border:1px solid #eceef4;border-radius:15px;box-shadow:0 5px 16px #28345a08}
        .icon{width:44px;height:44px;object-fit:cover;border-radius:13px;background:#edf0ff;flex:none}.details{flex:1;min-width:0}.details strong{display:block;font-size:12px}.details p{margin:4px 0 0;color:#7a8497;font-size:10px;line-height:1.35}
        .actions{display:flex;gap:6px}.btn{border:0;border-radius:9px;padding:8px 9px;font-size:10px;font-weight:700;cursor:pointer;background:#edf0ff;color:#4554d6}
        .btn.open{background:#5865f2;color:white}.btn.remove{background:#fff0ed;color:#c54631}.btn:disabled{opacity:.55;cursor:wait}
        .status{padding:20px 12px;text-align:center;background:#fff;border:1px dashed #dce1ec;border-radius:14px;color:#718096;font-size:11px}
        .search{width:100%;height:39px;margin:0 0 13px;padding:0 12px;border:1px solid #e6e8f0;border-radius:12px;background:#f6f7fb;font:inherit;font-size:12px;outline:0}
        @media(max-width:360px){.row{flex-wrap:wrap}.details{min-width:calc(100% - 60px)}.actions{width:100%;justify-content:flex-end}}
    </style>
    <script>
        if (new URLSearchParams(window.location.search).get('embedded') === '1') {
            document.documentElement.classList.add('embedded-app');
        }
    </script>
</head>
<body>
<div class="manager">
<header><div class="mark"><i class="fa-solid fa-grid-2"></i></div><h1>App Manager</h1><a class="home" href="/virtual-phone/user/user_phone_dashboard.html">Phone home</a></header>
<main>
    <section class="intro"><h2>Your installed apps</h2><p>Open an app or uninstall it from your phone. You can reinstall it from the Play Store later.</p></section>
    <input class="search" id="search" type="search" placeholder="Find an installed app" aria-label="Find an installed app">
    <section class="list" id="appList"><div class="status">Loading installed apps…</div></section>
</main>
</div>
<script>
(() => {
    const list = document.getElementById('appList');
    const search = document.getElementById('search');
    let installedApps = [];
    async function load() {
        try {
            const response = await fetch('/virtual-phone/user/apps/api/installed.php', {credentials:'same-origin'});
            const data = await response.json();
            if (!response.ok || !data.success) throw new Error(data.message || 'Could not load installed apps.');
            installedApps = data.apps || [];
            render();
        } catch (error) {
            const status = document.createElement('div');
            status.className = 'status';
            status.textContent = error.message;
            list.replaceChildren(status);
        }
    }
    function render() {
        const query = search.value.trim().toLowerCase();
        const apps = installedApps.filter(app => `${app.name} ${app.description || ''}`.toLowerCase().includes(query));
        list.replaceChildren();
        if (!apps.length) {
            const status = document.createElement('div');
            status.className = 'status';
            status.textContent = installedApps.length ? 'No installed apps match your search.' : 'No installed apps yet. Visit the Play Store to discover apps.';
            list.append(status);
            return;
        }
        for (const app of apps) {
            const row = document.createElement('article');
            row.className = 'row';
            const icon = document.createElement('img');
            icon.className = 'icon';
            icon.src = app.icon_path;
            icon.alt = '';
            const details = document.createElement('div');
            details.className = 'details';
            const name = document.createElement('strong');
            name.textContent = app.name;
            const description = document.createElement('p');
            description.textContent = app.description || 'Installed app';
            details.append(name, description);
            const actions = document.createElement('div');
            actions.className = 'actions';
            const open = document.createElement('button');
            open.className = 'btn open';
            open.type = 'button';
            open.textContent = 'Open';
            open.addEventListener('click', () => {
                window.location.href = `/virtual-phone/user/apps/runtime.php?id=${encodeURIComponent(app.id)}`;
            });
            const remove = document.createElement('button');
            remove.className = 'btn remove';
            remove.type = 'button';
            remove.textContent = 'Uninstall';
            remove.addEventListener('click', async () => {
                if (!window.confirm(`Uninstall ${app.name}?`)) return;
                remove.disabled = true;
                try {
                    const response = await fetch('/virtual-phone/user/apps/api/installed.php', {
                        method:'DELETE', credentials:'same-origin',
                        headers:{'Content-Type':'application/json'},
                        body:JSON.stringify({app_id:app.id})
                    });
                    const data = await response.json();
                    if (!response.ok || !data.success) throw new Error(data.message || 'Could not uninstall this app.');
                    installedApps = installedApps.filter(item => String(item.id) !== String(app.id));
                    render();
                } catch (error) {
                    window.alert(error.message);
                    remove.disabled = false;
                }
            });
            actions.append(open, remove);
            row.append(icon, details, actions);
            list.append(row);
        }
    }
    search.addEventListener('input', render);
    load();
})();
</script>
</body>
</html>
