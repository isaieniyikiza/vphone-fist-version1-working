<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Messages · Virtual Phone</title>
    <link rel="stylesheet" href="/virtual-phone/user/settings/theme.css">
    <script defer src="/virtual-phone/user/settings/theme.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        :root { font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif; color: #172033; background: #e8eef5; }
        body { margin: 0; min-height: 100vh; min-height: 100dvh; background: linear-gradient(145deg,#eff5f5,#e7edf5); }
        .messages-app { display: flex; flex-direction: column; width: min(100%, 560px); height: 100vh; height: 100dvh; margin: auto; background: #f7f9fc; box-shadow: 0 0 40px #17203316; }
        header { display:flex; align-items:center; gap:12px; padding: 18px 17px 14px; background:#fff; border-bottom:1px solid #e8edf4; }
        .brand { display:grid; place-items:center; width:42px; height:42px; border-radius:14px; background:#e5f2fa; color:#277aa1; font-size:17px; }
        h1 { flex:1; margin:0; font-size:19px; }
        .home { display:grid; place-items:center; width:36px; height:36px; border-radius:11px; color:#34566c; background:#eef4f7; text-decoration:none; }
        .contact-back { display:grid; place-items:center; width:34px; height:34px; flex:none; border:0; border-radius:10px; color:#34566c; background:#eef4f7; cursor:pointer; }
        html.embedded-app .home { display:none; }
        .body { display:grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); flex:1; min-height:0; }
        .contacts { min-height:0; overflow-y:auto; border-right:1px solid #e5eaf0; background:#fff; }
        .contact-heading { position:sticky; top:0; z-index:1; padding:15px 14px 10px; background:#fff; }
        .contact-heading strong { display:block; margin-bottom:10px; font-size:14px; }
        .search { width:100%; padding:10px 11px; border:1px solid #e4e9ef; border-radius:11px; background:#f5f7fa; outline:none; font:inherit; font-size:11px; }
        .contact-list { display:grid; gap:2px; padding:0 6px 12px; }
        .contact { display:flex; align-items:center; gap:10px; padding:10px 8px; border:0; border-radius:12px; background:transparent; color:inherit; text-align:left; cursor:pointer; }
        .contact:hover,.contact.selected { background:#edf5f8; }
        .avatar { width:39px; height:39px; flex:none; border-radius:50%; object-fit:cover; background:#e7edf2; }
        .contact-name { overflow:hidden; font-size:11px; font-weight:700; text-overflow:ellipsis; white-space:nowrap; }
        .contact-hint { display:block; margin-top:3px; color:#8a95a5; font-size:9px; }
        .conversation { display:flex; flex-direction:column; min-width:0; min-height:0; }
        .conversation-header { display:flex; align-items:center; gap:10px; min-height:64px; padding:10px 14px; border-bottom:1px solid #e8edf3; background:#fff; }
        .conversation-header strong { font-size:12px; }
        .conversation-content { display:flex; flex:1; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:18px; color:#718095; text-align:center; }
        .empty-icon { display:grid; place-items:center; width:54px; height:54px; border-radius:18px; color:#287c9d; background:#e4f2f6; font-size:21px; }
        .conversation-content strong { color:#304055; font-size:13px; }
        .conversation-content p { max-width:230px; margin:0; font-size:10px; line-height:1.55; }
        .compose { display:grid; grid-template-columns:1fr 40px; gap:8px; padding:12px; border-top:1px solid #e8edf3; background:#fff; }
        .compose input { min-width:0; padding:11px 12px; border:1px solid #e1e7ee; border-radius:12px; outline:none; font:inherit; font-size:11px; }
        .compose button { display:grid; place-items:center; border:0; border-radius:12px; color:#fff; background:#287d9e; cursor:pointer; }
        .notice { grid-column:1/-1; min-height:14px; color:#b46020; font-size:9px; line-height:1.4; }
        .status { padding:18px 10px; color:#748197; text-align:center; font-size:11px; }
        @media(max-width:390px) { .body { grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr); } .contact { gap:7px; padding:9px 5px; } .avatar { width:33px; height:33px; } .compose { grid-template-columns:1fr 36px; padding:8px; } }
    </style>
    <script>if (new URLSearchParams(location.search).get('embedded') === '1') document.documentElement.classList.add('embedded-app');</script>
</head>
<body>
<div class="messages-app">
    <header><div class="brand"><i class="fa-regular fa-message"></i></div><h1>Messages</h1><a class="home" href="/virtual-phone/user/user_phone_dashboard.html" title="Phone home" aria-label="Phone home"><i class="fa-solid fa-house"></i></a></header>
    <main class="body">
        <section class="contacts" aria-label="Contacts">
            <div class="contact-heading"><strong>Contacts</strong><input id="searchContacts" class="search" type="search" placeholder="Search people" aria-label="Search contacts"></div>
            <div id="contactList" class="contact-list"><div class="status">Loading contacts…</div></div>
        </section>
        <section class="conversation" aria-label="Conversation">
            <div id="conversationHeader" class="conversation-header"><div class="empty-icon"><i class="fa-regular fa-comments"></i></div><strong>Select a contact</strong></div>
            <div id="conversationContent" class="conversation-content"><div class="empty-icon"><i class="fa-regular fa-message"></i></div><strong>Your conversations</strong><p>Select a contact to prepare a message. The SMS connection is not enabled yet.</p></div>
            <form id="composeForm" class="compose"><input id="messageInput" autocomplete="off" placeholder="Choose a contact first…" disabled><button id="sendButton" type="submit" disabled title="Send message" aria-label="Send message"><i class="fa-solid fa-paper-plane"></i></button><div id="sendNotice" class="notice" role="status" aria-live="polite"></div></form>
        </section>
    </main>
</div>
<script>
(() => {
    const list = document.getElementById('contactList');
    const search = document.getElementById('searchContacts');
    const header = document.getElementById('conversationHeader');
    const content = document.getElementById('conversationContent');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');
    const sendNotice = document.getElementById('sendNotice');
    let contacts = [];
    let selectedContact = null;

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    }

    function renderContacts() {
        const query = search.value.trim().toLowerCase();
        const visible = contacts.filter(contact => contact.username.toLowerCase().includes(query));
        if (!visible.length) {
            list.innerHTML = `<div class="status">${contacts.length ? 'No matching contacts.' : 'No contacts are available yet.'}</div>`;
            return;
        }
        list.innerHTML = visible.map(contact => `<button type="button" class="contact ${selectedContact?.id === contact.id ? 'selected' : ''}" data-contact-id="${contact.id}"><img class="avatar" src="${escapeHtml(contact.profile_image)}" onerror="this.onerror=null;this.src='/virtual-phone/vphone.png'" alt=""><span class="min-w-0"><span class="contact-name">${escapeHtml(contact.username)}</span><span class="contact-hint">Tap to compose</span></span></button>`).join('');
        list.querySelectorAll('[data-contact-id]').forEach(button => button.addEventListener('click', () => {
            selectedContact = contacts.find(contact => contact.id === Number(button.dataset.contactId)) || null;
            renderContacts();
            renderConversation();
        }));
    }

    function renderConversation() {
        if (!selectedContact) {
            header.innerHTML = '<div class="empty-icon"><i class="fa-regular fa-comments"></i></div><strong>Select a contact</strong>';
            content.innerHTML = '<div class="empty-icon"><i class="fa-regular fa-message"></i></div><strong>Your conversations</strong><p>Select one of your saved contacts to prepare a message.</p>';
            messageInput.disabled = true;
            messageInput.placeholder = 'Choose a contact first…';
            sendButton.disabled = true;
            sendNotice.textContent = '';
            return;
        }
        header.innerHTML = `<button id="backToContacts" type="button" class="contact-back" aria-label="Back to contacts"><i class="fa-solid fa-arrow-left"></i></button><img class="avatar" src="${escapeHtml(selectedContact.profile_image)}" onerror="this.onerror=null;this.src='/virtual-phone/vphone.png'" alt=""><span class="min-w-0"><strong class="block">${escapeHtml(selectedContact.username)}</strong><small class="text-slate-500">${escapeHtml(selectedContact.number || '')}</small></span>`;
        header.querySelector('#backToContacts').addEventListener('click', () => {
            selectedContact = null;
            renderContacts();
            renderConversation();
        });
        content.innerHTML = `<div class="empty-icon"><i class="fa-regular fa-paper-plane"></i></div><strong>Message ${escapeHtml(selectedContact.username)}</strong><p>Messages are being built while the GSM module is connected. Your message will not be sent yet.</p>`;
        messageInput.disabled = false;
        messageInput.placeholder = `Write to ${selectedContact.username}…`;
        sendButton.disabled = false;
        sendNotice.textContent = '';
        messageInput.focus();
    }

    search.addEventListener('input', renderContacts);
    document.getElementById('composeForm').addEventListener('submit', event => {
        event.preventDefault();
        if (!selectedContact || !messageInput.value.trim()) {
            sendNotice.textContent = selectedContact ? 'Write a message first.' : 'Choose a contact first.';
            return;
        }
        sendNotice.textContent = 'We are still building this feature. Messages will be sent after the GSM module is connected.';
        messageInput.value = '';
    });

    fetch('/virtual-phone/user/messages/api/contacts.php', { credentials: 'same-origin', cache: 'no-store' })
        .then(async response => {
            const data = await response.json();
            if (!response.ok || !data.success) throw new Error(data.message || 'Could not load contacts.');
            contacts = data.contacts || [];
            renderContacts();
        })
        .catch(error => { list.innerHTML = `<div class="status">${escapeHtml(error.message)}</div>`; });
})();
</script>
</body>
</html>
