                // ─── Helpers ──────────────────────────────────────────────
                function getCategoryStats(files) {
                    const stats = {
                        image: { count: 0, bytes: 0 },
                        video: { count: 0, bytes: 0 },
                        audio: { count: 0, bytes: 0 },
                        document: { count: 0, bytes: 0 },
                        app: { count: 0, bytes: 0 }
                    };
                    files.forEach(f => {
                        const type = f.type || 'document';
                        if (stats[type]) {
                            stats[type].count++;
                            stats[type].bytes += Math.max(0, Number(f.size) || 0);
                        }
                    });
                    return stats;
                }

                function updateCounts() {
                    const total = STATE.allFiles.length;
                    const starred = STATE.allFiles.filter(f => f.starred).length;
                    const safe = STATE.allFiles.filter(f => f.safe).length;
                    if (starredCount) starredCount.textContent = starred;
                    if (safeCount) safeCount.textContent = safe;
                    if (allCount) allCount.textContent = total;
                    const totalUsed = STATE.storageUsedBytes;
                    const quotaBytes = STATE.storageQuotaBytes;
                    const remainingBytes = Math.max(quotaBytes - totalUsed, 0);
                    const percent = Math.min((totalUsed / quotaBytes) * 100, 100);
                    if (storageUsage) storageUsage.textContent = formatBytes(totalUsed) + ' used · ' + formatBytes(remainingBytes) + ' free';
                    if (storageQuotaAmount) storageQuotaAmount.textContent = formatBytes(totalUsed) + ' / ' + formatBytes(quotaBytes);
                    const storageQuotaPlan = document.getElementById('storageQuotaPlan');
                    if (storageQuotaPlan) storageQuotaPlan.textContent = formatBytes(quotaBytes) + ' total';
                    if (storageQuotaFill) storageQuotaFill.style.width = percent.toFixed(2) + '%';
                    if (storageQuotaFree) storageQuotaFree.textContent = formatBytes(remainingBytes) + ' free · ' + percent.toFixed(1) + '% used';
                }

                function renderCategories() {
                    const stats = getCategoryStats(STATE.allFiles);
                    const categories = [
                        { id: 'image', label: 'Images', icon: 'fa-image', color: 'images', ...stats.image },
                        { id: 'video', label: 'Videos', icon: 'fa-video', color: 'videos', ...stats.video },
                        { id: 'audio', label: 'Audio', icon: 'fa-music', color: 'audio', ...stats.audio },
                        { id: 'document', label: 'Docs', icon: 'fa-file-alt', color: 'documents', ...stats.document },
                        { id: 'app', label: 'Apps', icon: 'fa-th', color: 'apps',
                            count: STATE.installedApps.length + stats.app.count, bytes: stats.app.bytes },
                    ];
                    categoriesGrid.innerHTML = categories.map(cat => `
                            <div class="fm-cat" data-id="${cat.id}">
                                <div class="cat-icon ${cat.color}"><i class="fas ${cat.icon}"></i></div>
                                <div class="cat-info">
                                    <div class="cat-name">${cat.label}</div>
                                    <div class="cat-size">${cat.count} ${cat.id === 'app' ? 'apps' : 'files'} · ${formatBytes(cat.bytes)}</div>
                                </div>
                            </div>
                        `).join('');

                    categoriesGrid.querySelectorAll('.fm-cat').forEach(el => {
                        el.addEventListener('click', () => {
                            const id = el.dataset.id;
                            if (id === 'app') {
                                openInstalledApps();
                                currentCategory = 'app';
                                STATE.currentFilter = null;
                                return;
                            }
                            const files = STATE.allFiles.filter(f => f.type === id);
                            const label = getCategoryLabel(id);
                            const icon = getCategoryIcon(id);
                            showFileList(label, files, icon);
                            currentCategory = id;
                            STATE.currentFilter = null;
                        });
                    });

                    updateCounts();
                }

                async function openInstalledApps() {
                    const category = categoriesGrid.querySelector('.fm-cat[data-id="app"] .cat-size');
                    if (category) category.textContent = '…';
                    showFileList('Installed Apps', [], 'fa-th');
                    flItems.innerHTML = '<div class="fl-empty"><i class="fas fa-spinner fa-spin"></i><p>Loading your installed apps…</p></div>';
                    try {
                        const installedApps = await apiFetchInstalledApps();
                        const count = installedApps.length + STATE.allFiles.filter(file => file.type === 'app').length;
                        if (category) category.textContent = count;
                        renderInstalledApps(installedApps);
                    } catch (error) {
                        if (category) category.textContent = STATE.installedApps.length + STATE.allFiles.filter(file => file.type === 'app').length;
                        flItems.innerHTML = '';
                        const status = document.createElement('div');
                        status.className = 'fl-empty';
                        status.textContent = error.message || 'Could not load your installed apps.';
                        flItems.appendChild(status);
                        showNotification('⚠ ' + status.textContent, 'error');
                    }
                }

                function renderInstalledApps(apps) {
                    flItems.replaceChildren();
                    const packageFiles = STATE.allFiles.filter(file => file.type === 'app');
                    if (apps.length === 0 && packageFiles.length === 0) {
                        const empty = document.createElement('div');
                        empty.className = 'fl-empty';
                        const icon = document.createElement('i');
                        icon.className = 'fas fa-grid-2';
                        const message = document.createElement('p');
                        message.textContent = 'No installed apps yet';
                        const hint = document.createElement('div');
                        hint.className = 'theme-note';
                        hint.textContent = 'Install apps from Play Store. Your installed apps will appear here.';
                        empty.append(icon, message, hint);
                        flItems.appendChild(empty);
                        return;
                    }

                    for (const app of apps) {
                        const card = document.createElement('article');
                        card.className = 'installed-app-card';
                        const icon = document.createElement('img');
                        icon.src = app.icon_path || '';
                        icon.alt = '';
                        icon.onerror = () => {
                            icon.replaceWith(Object.assign(document.createElement('span'), {
                                className: 'installed-app-icon',
                                innerHTML: '<i class="fas fa-cube"></i>'
                            }));
                        };
                        const details = document.createElement('div');
                        details.className = 'installed-app-details';
                        const name = document.createElement('strong');
                        name.textContent = app.name || 'Installed app';
                        const description = document.createElement('span');
                        description.textContent = app.description || app.slug || 'Ready to use';
                        details.append(name, description);
                        const actions = document.createElement('div');
                        actions.className = 'installed-app-actions';
                        const open = document.createElement('button');
                        open.type = 'button';
                        open.textContent = 'Open';
                        open.addEventListener('click', () => {
                            window.location.href = '/virtual-phone/user/apps/runtime.php?id=' + encodeURIComponent(app.id);
                        });
                        const uninstall = document.createElement('button');
                        uninstall.type = 'button';
                        uninstall.className = 'uninstall';
                        uninstall.textContent = 'Remove';
                        uninstall.addEventListener('click', async () => {
                            if (!window.confirm('Uninstall ' + (app.name || 'this app') + '?')) return;
                            uninstall.disabled = true;
                            try {
                                await apiUninstallApp(app.id);
                                STATE.installedApps = STATE.installedApps.filter(item => String(item.id) !== String(app.id));
                                renderCategories();
                                renderInstalledApps(STATE.installedApps);
                                showNotification('✓ App uninstalled.', 'success');
                            } catch (error) {
                                uninstall.disabled = false;
                                showNotification('⚠ ' + error.message, 'error');
                            }
                        });
                        actions.append(open, uninstall);
                        card.append(icon, details, actions);
                        flItems.appendChild(card);
                    }

                    if (packageFiles.length) {
                        const packagesLabel = document.createElement('div');
                        packagesLabel.className = 'fm-section-label';
                        packagesLabel.style.margin = '10px 0 7px';
                        packagesLabel.textContent = 'Uploaded app packages';
                        flItems.appendChild(packagesLabel);
                        for (const file of packageFiles) {
                            const packageRow = document.createElement('article');
                            packageRow.className = 'installed-app-card';
                            const icon = document.createElement('span');
                            icon.className = 'installed-app-icon';
                            icon.innerHTML = '<i class="fas fa-box-archive"></i>';
                            const details = document.createElement('div');
                            details.className = 'installed-app-details';
                            const name = document.createElement('strong');
                            name.textContent = file.name;
                            const info = document.createElement('span');
                            info.textContent = formatBytes(file.size || 0) + ' · package file';
                            details.append(name, info);
                            packageRow.append(icon, details);
                            flItems.appendChild(packageRow);
                        }
                    }
                }

                function getThumbnailHTML(file) {
                    const type = file.type || 'document';
                    if (type === 'image') {
                        return `<img class="fl-thumb" src="${getDownloadUrl(file.id)}" alt="" loading="lazy">`;
                    } else if (type === 'video') {
                        return `<div class="fl-thumb-placeholder fl-thumb-video" style="background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;">
                                <i class="fas fa-play-circle" style="font-size:28px;color:#3b82f6;"></i>
                                <span class="sub">${formatBytes(file.size || 0)}</span>
                            </div>`;
                    } else if (type === 'audio') {
                        return `<div class="fl-thumb-placeholder" style="background:linear-gradient(135deg,#2d1b69,#4a2c8a);color:#fff;"><i class="fas fa-music" style="font-size:24px;color:#8b5cf6;"></i></div>`;
                    } else if (type === 'document') {
                        return `<div class="fl-thumb-placeholder" style="background:linear-gradient(135deg,#f0f4ff,#dce3f0);"><i class="fas fa-file-alt" style="font-size:24px;color:#3b82f6;"></i></div>`;
                    } else {
                        return `<div class="fl-thumb-placeholder" style="background:linear-gradient(135deg,#e8f5e9,#c8e6c9);"><i class="fas fa-th" style="font-size:24px;color:#10b981;"></i></div>`;
                    }
                }

                function renderFileItems(files) {
                    if (!files || files.length === 0) {
                        flItems.innerHTML = `
                                <div class="fl-empty">
                                    <i class="fas fa-folder-open"></i>
                                    <p>No files in this folder</p>
                                    <div style="font-size:10px;color:#ccc;margin-top:2px;">Upload files to get started</div>
                                </div>
                            `;
                        return;
                    }

                    const viewClass = STATE.viewMode === 'grid' ? 'grid-view' : 'list-view';
                    flItems.className = viewClass;

                    let html = '';
                    for (const f of files) {
                        const type = f.type || 'document';
                        const isStarred = f.starred ? '⭐' : '';
                        const isSafe = f.safe ? '🔒' : '';
                        const thumbHtml = getThumbnailHTML(f);

                        html += `
                                <div class="fl-item" data-id="${f.id}">
                                    <div class="fl-thumb-wrapper" style="width:100%;height:100%;position:relative;">
                                        ${thumbHtml}
                                        ${type === 'video' || type === 'audio' ? '<div class="play-badge"><i class="fas fa-play"></i></div>' : ''}
                                    </div>
                                    <div class="fl-overlay">
                                        <div class="fl-name">${f.name}</div>
                                        <div class="fl-meta">
                                            <span>${formatBytes(f.size || 0)}</span>
                                            ${isStarred ? '<span class="tag">⭐</span>' : ''}
                                            ${isSafe ? '<span class="tag">🔒</span>' : ''}
                                        </div>
                                    </div>
                                    <button class="fl-menu-btn" data-id="${f.id}"><i class="fas fa-ellipsis-v"></i></button>
                                    <div class="fl-dropdown" data-id="${f.id}">
                                        ${type === 'image' || type === 'video' || type === 'audio' ? '<button data-action="preview"><i class="fas fa-eye"></i> Preview / Play</button>' : ''}
                                        <button data-action="detail"><i class="fas fa-info-circle"></i> Details</button>
                                        <button data-action="rename"><i class="fas fa-pen"></i> Rename</button>
                                        <button data-action="copy"><i class="fas fa-copy"></i> Copy</button>
                                        <button data-action="send"><i class="fas fa-share-alt"></i> Send</button>
                                        <button data-action="star"><i class="fas fa-star"></i> ${f.starred ? 'Unstar' : 'Star'}</button>
                                        <button data-action="safe"><i class="fas fa-shield-alt"></i> ${f.safe ? 'Unsafe' : 'Safe'}</button>
                                        <button data-action="delete" class="danger"><i class="fas fa-trash-alt"></i> Delete</button>
                                    </div>
                                </div>
                            `;
                    }
                    flItems.innerHTML = html;

                    // ─── Events ────────────────────────────────────────────
                    flItems.querySelectorAll('.fl-item').forEach(item => {
                        const id = item.dataset.id;
                        const menuBtn = item.querySelector('.fl-menu-btn');
                        const dropdown = item.querySelector('.fl-dropdown');

                        item.addEventListener('click', (e) => {
                            if (e.target.closest('.fl-menu-btn') || e.target.closest('.fl-dropdown'))
                                return;
                            const file = STATE.allFiles.find(f => f.id === id);
                            if (file) {
                                if (file.type === 'image' || file.type === 'video' || file.type === 'audio') {
                                    openPreview(file);
                                } else {
                                    showFileDetail(file);
                                }
                            }
                        });

                        menuBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            document.querySelectorAll('.fl-dropdown.open').forEach(d => {
                                if (d.dataset.id !== id) d.classList.remove('open');
                            });
                            dropdown.classList.toggle('open');
                        });

                        dropdown.querySelectorAll('button').forEach(btn => {
                            btn.addEventListener('click', async (e) => {
                                e.stopPropagation();
                                const action = btn.dataset.action;
                                const file = STATE.allFiles.find(f => f.id === id);
                                if (!file) return;
                                dropdown.classList.remove('open');
                                await handleFileAction(action, file);
                            });
                        });
                    });

                    document.addEventListener('click', () => {
                        document.querySelectorAll('.fl-dropdown.open').forEach(d => d.classList.remove('open'));
                    });
                }

                function showFileList(title, files, icon = 'fa-folder') {
                    flTitle.innerHTML = `<i class="fas ${icon}"></i> ${title}`;
                    filteredFiles = files || [];
                    renderFileItems(filteredFiles);
                    contentEl.classList.remove('active');
                    fileListView.classList.add('active');
                }

                function hideFileList() {
                    fileListView.classList.remove('active');
                    contentEl.classList.add('active');
                    currentCategory = null;
                    STATE.currentFilter = null;
                }

                // ─── File Actions ─────────────────────────────────────────
                async function handleFileAction(action, file) {
                    switch (action) {
                        case 'preview':
                            if (file.type === 'image' || file.type === 'video' || file.type === 'audio') {
                                openPreview(file);
                            } else {
                                showFileDetail(file);
                            }
                            break;
                        case 'rename':
                            const newName = prompt('Rename file:', file.name);
                            if (newName && newName.trim() !== '' && newName !== file.name) {
                                showToast('Rename requires server support. (Not implemented in API)', 'info');
                            }
                            break;
                        case 'copy':
                            showToast('Copy requires server support. (Not implemented in API)', 'info');
                            break;
                        case 'delete':
                            if (confirm('Delete "' + file.name + '"?')) {
                                try {
                                    const result = await apiDeleteFile(file.id);
                                    if (result.success) {
                                        showToast('Deleted "' + file.name + '"', 'info');
                                        await refreshView();
                                        if (STATE.previewOpen) closePreview();
                                    } else {
                                        showToast('Delete failed: ' + (result.message || 'Unknown error'), 'error');
                                    }
                                } catch (e) {
                                    showToast('Network error: ' + e.message, 'error');
                                }
                            }
                            break;
                        case 'send':
                            showSendOptions(file);
                            break;
                        case 'star':
                            showToast('Star/unstar requires server support. (Not implemented in API)', 'info');
                            break;
                        case 'safe':
                            showToast('Safe toggle requires server support. (Not implemented in API)', 'info');
                            break;
                        case 'detail':
                            showFileDetail(file);
                            break;
                        default:
                            break;
                    }
                }

                // ─── Send ──────────────────────────────────────────────────
                function showSendOptions(file) {
                    const modal = document.createElement('div');
                    modal.className = 'send-modal';
                    modal.style.cssText =
                        'position:absolute;inset:0;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;border-radius:24px;';
                    modal.innerHTML = `
                            <div style="background:#fff;border-radius:16px;padding:20px 24px;max-width:220px;width:100%;text-align:center;animation:modalIn .25s cubic-bezier(.175,.885,.32,1.275);">
                                <div style="font-size:16px;font-weight:700;color:#1a1a1a;margin-bottom:4px;">Share</div>
                                <div style="font-size:11px;color:#888;margin-bottom:14px;word-break:break-all;">${file.name}</div>
                                <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
                                    <button class="send-option" data-method="bluetooth" style="background:#3b82f6;border:none;border-radius:10px;padding:8px 14px;color:#fff;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:transform .1s;"><i class="fab fa-bluetooth-b"></i> Bluetooth</button>
                                    <button class="send-option" data-method="xender" style="background:#10b981;border:none;border-radius:10px;padding:8px 14px;color:#fff;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:transform .1s;"><i class="fas fa-share-alt"></i> Xender</button>
                                    <button class="send-option" data-method="cancel" style="background:#ef4444;border:none;border-radius:10px;padding:8px 14px;color:#fff;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:transform .1s;"><i class="fas fa-times"></i> Cancel</button>
                                </div>
                            </div>
                        `;
                    document.getElementById('appBody').appendChild(modal);

                    modal.querySelectorAll('.send-option').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const method = btn.dataset.method;
                            if (method === 'cancel') { modal.remove(); return; }
                            const label = method === 'bluetooth' ? 'Bluetooth' : 'Xender';
                            showToast('📤 Sending "' + file.name + '" via ' + label + '…', 'info');
                            setTimeout(() => {
                                showToast('✅ Sent via ' + label + '!', 'success');
                            }, 1200);
                            setTimeout(() => modal.remove(), 300);
                        });
                    });
                }

                // ─── Preview ──────────────────────────────────────────────
                function openPreview(file) {
                    STATE.previewOpen = true;
                    previewName.textContent = file.name;

                    const url = getDownloadUrl(file.id);
                    let html = '';
                    if (file.type === 'image') {
                        html = `<img src="${url}" alt="${file.name}" />`;
                    } else if (file.type === 'video') {
                        html =
                            `<video src="${url}" controls autoplay style="width:100%;max-height:60vh;border-radius:12px;background:#000;"></video>`;
                    } else if (file.type === 'audio') {
                        html =
                            `<audio src="${url}" controls autoplay style="width:100%;border-radius:12px;background:#000;padding:20px;"></audio>`;
                    } else {
                        html = `
                                <div class="placeholder">
                                    <i class="fas ${getCategoryIcon(file.type)}"></i>
                                    <div class="sub">${file.name}</div>
                                    <div class="sub" style="font-size:12px;">${formatBytes(file.size || 0)}</div>
                                </div>
                            `;
                    }
                    previewContent.innerHTML = html;

                    previewActions.innerHTML = `
                            <button data-action="detail"><i class="fas fa-info-circle"></i> Details</button>
                            <button data-action="send"><i class="fas fa-share-alt"></i> Send</button>
                            <button data-action="delete" class="danger"><i class="fas fa-trash-alt"></i> Delete</button>
                        `;
                    previewActions.querySelectorAll('button').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            const action = btn.dataset.action;
                            await handleFileAction(action, file);
                            if (action === 'delete') closePreview();
                        });
                    });

                    previewOverlay.classList.add('show');
                }

                function closePreview() {
                    previewOverlay.classList.remove('show');
                    STATE.previewOpen = false;
                    previewContent.innerHTML = '';
                    previewActions.innerHTML = '';
                }

                // ─── File Detail ──────────────────────────────────────────
                function showFileDetail(file) {
                    STATE.selectedFile = file;
                    const modal = document.createElement('div');
                    modal.className = 'detail-modal';
                    modal.style.cssText =
                        'position:absolute;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(6px);z-index:25;display:flex;align-items:center;justify-content:center;padding:16px;border-radius:24px;';
                    const type = file.type || 'document';
                    const iconName = getCategoryIcon(type);
                    modal.innerHTML = `
                            <div style="background:#fff;border-radius:16px;padding:18px 20px 20px;max-width:260px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.4);animation:modalIn .25s cubic-bezier(.175,.885,.32,1.275);">
                                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(0,0,0,0.06);">
                                    <div style="font-size:14px;font-weight:700;color:#1a1a1a;display:flex;align-items:center;gap:8px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                                        <i class="fas ${iconName}" style="color:#3b82f6;"></i> ${file.name}
                                    </div>
                                    <button class="detail-close" style="background:rgba(0,0,0,0.06);border:none;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:12px;color:#666;display:flex;align-items:center;justify-content:center;transition:background .15s;"><i class="fas fa-times"></i></button>
                                </div>
                                <div style="display:flex;flex-direction:column;gap:4px;">
                                    <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid rgba(0,0,0,0.03);"><span style="color:#888;font-weight:500;">Type</span><span style="color:#1a1a1a;font-weight:500;">${getCategoryLabel(type)}</span></div>
                                    <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid rgba(0,0,0,0.03);"><span style="color:#888;font-weight:500;">Size</span><span style="color:#1a1a1a;font-weight:500;">${formatBytes(file.size || 0)}</span></div>
                                    <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid rgba(0,0,0,0.03);"><span style="color:#888;font-weight:500;">Added</span><span style="color:#1a1a1a;font-weight:500;">${formatDate(file.date_added)}</span></div>
                                    <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid rgba(0,0,0,0.03);"><span style="color:#888;font-weight:500;">Starred</span><span style="color:#1a1a1a;font-weight:500;">${file.starred ? '⭐ Yes' : 'No'}</span></div>
                                    <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px;"><span style="color:#888;font-weight:500;">Safe</span><span style="color:#1a1a1a;font-weight:500;">${file.safe ? '🔒 Yes' : 'No'}</span></div>
                                </div>
                                <div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;justify-content:center;border-top:1px solid rgba(0,0,0,0.06);padding-top:12px;">
                                    ${file.type === 'image' || file.type === 'video' ? `<button class="detail-action" data-action="preview" style="background:#3b82f6;border:none;border-radius:8px;padding:5px 12px;color:#fff;font-size:10px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;"><i class="fas fa-eye"></i> Preview</button>` : ''}
                                    <button class="detail-action" data-action="send" style="background:rgba(0,0,0,0.05);border:none;border-radius:8px;padding:5px 12px;font-size:10px;font-weight:500;color:#444;cursor:pointer;display:flex;align-items:center;gap:4px;"><i class="fas fa-share-alt"></i> Send</button>
                                    <button class="detail-action" data-action="delete" style="background:rgba(239,68,68,0.08);border:none;border-radius:8px;padding:5px 12px;font-size:10px;font-weight:500;color:#ef4444;cursor:pointer;display:flex;align-items:center;gap:4px;"><i class="fas fa-trash-alt"></i> Delete</button>
                                </div>
                            </div>
                        `;
                    document.getElementById('appBody').appendChild(modal);

                    modal.querySelector('.detail-close').addEventListener('click', () => modal.remove());
                    modal.querySelectorAll('.detail-action').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            const action = btn.dataset.action;
                            modal.remove();
                            await handleFileAction(action, file);
                        });
                    });
                }

                // ─── Settings ─────────────────────────────────────────────
                function openSettings() {
                    STATE.settingsOpen = true;
                    const totalUsed = STATE.storageUsedBytes;
                    const quotaBytes = STATE.storageQuotaBytes;
                    const percent = Math.min((totalUsed / quotaBytes) * 100, 100);
                    const freeBytes = Math.max(quotaBytes - totalUsed, 0);
                    const categoryStats = getCategoryStats(STATE.allFiles);

                    settingsBody.innerHTML = `
                            <div class="set-row"><span class="set-label">Appearance</span><span class="set-value">Personalize</span></div>
                            <div class="theme-options" role="group" aria-label="File Manager theme">
                                <button type="button" class="theme-option" data-theme="ocean" aria-label="Ocean theme"></button>
                                <button type="button" class="theme-option" data-theme="violet" aria-label="Violet theme"></button>
                                <button type="button" class="theme-option" data-theme="sunset" aria-label="Sunset theme"></button>
                                <button type="button" class="theme-option" data-theme="mint" aria-label="Mint theme"></button>
                            </div>
                            <input type="file" id="wallpaperInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
                            <button type="button" class="wallpaper-upload" id="wallpaperUploadBtn"><i class="fas fa-image"></i> Choose background image</button>
                            <p class="theme-note">The theme is saved on this device. Background images are resized before saving.</p>
                            ${STATE.storageWallpaper ? '<button type="button" class="wallpaper-upload" id="removeWallpaperBtn"><i class="fas fa-rotate-left"></i> Remove custom background</button>' : ''}
                            <div style="margin-bottom:4px;">
                                <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:500;color:#1a1a1a;">
                                    <span>Storage</span>
                                    <span>${formatBytes(totalUsed)} / ${formatBytes(quotaBytes)}</span>
                                </div>
                                <div class="storage-bar"><div class="fill" style="width:${percent}%;"></div></div>
                                <div class="storage-stats">
                                    <span>${formatBytes(freeBytes)} free</span>
                                    <span>${percent.toFixed(0)}% used</span>
                                </div>
                            </div>
                            <div class="set-row"><span class="set-label">Total files</span><span class="set-value">${STATE.allFiles.length}</span></div>
                            <div class="set-row"><span class="set-label">Images</span><span class="set-value">${categoryStats.image.count} · ${formatBytes(categoryStats.image.bytes)}</span></div>
                            <div class="set-row"><span class="set-label">Videos</span><span class="set-value">${categoryStats.video.count} · ${formatBytes(categoryStats.video.bytes)}</span></div>
                            <div class="set-row"><span class="set-label">Audio</span><span class="set-value">${categoryStats.audio.count} · ${formatBytes(categoryStats.audio.bytes)}</span></div>
                            <div class="set-row"><span class="set-label">Documents</span><span class="set-value">${categoryStats.document.count} · ${formatBytes(categoryStats.document.bytes)}</span></div>
                            <div class="set-row"><span class="set-label">App packages</span><span class="set-value">${categoryStats.app.count} · ${formatBytes(categoryStats.app.bytes)}</span></div>
                            <div class="set-actions">
                                <button id="refreshStorageBtn"><i class="fas fa-sync"></i> Refresh</button>
                            </div>
                        `;

                    settingsOverlay.classList.add('show');
                    const themeButtons = settingsBody.querySelectorAll('.theme-option');
                    themeButtons.forEach(button => {
                        button.setAttribute('aria-pressed', String(button.dataset.theme === STATE.storageTheme && !STATE.storageWallpaper));
                        button.addEventListener('click', () => {
                            STATE.storageTheme = button.dataset.theme;
                            STATE.storageWallpaper = '';
                            applyStorageAppearance();
                            saveStorageAppearance();
                            openSettings();
                        });
                    });
                    const wallpaperInput = document.getElementById('wallpaperInput');
                    document.getElementById('wallpaperUploadBtn').addEventListener('click', () => wallpaperInput.click());
                    wallpaperInput.addEventListener('change', async () => {
                        const image = wallpaperInput.files?.[0];
                        if (!image) return;
                        if (!image.type.startsWith('image/')) {
                            showNotification('Choose a supported image file for your background.', 'error');
                            wallpaperInput.value = '';
                            return;
                        }
                        try {
                            const wallpaper = await resizeWallpaper(image);
                            STATE.storageWallpaper = wallpaper;
                            applyStorageAppearance();
                            saveStorageAppearance();
                            showNotification('✓ Background updated.', 'success');
                            openSettings();
                        } catch (error) {
                            showNotification('Could not apply that image: ' + error.message, 'error');
                        } finally {
                            wallpaperInput.value = '';
                        }
                    });
                    document.getElementById('removeWallpaperBtn')?.addEventListener('click', () => {
                        STATE.storageWallpaper = '';
                        applyStorageAppearance();
                        saveStorageAppearance();
                        openSettings();
                    });

                    document.getElementById('refreshStorageBtn').addEventListener('click', async () => {
                        await refreshView();
                        openSettings();
                        showToast('Refreshed.', 'success');
                    });
                }

                function resizeWallpaper(file) {
                    return new Promise((resolve, reject) => {
                        const image = new Image();
                        const objectUrl = URL.createObjectURL(file);
                        image.onload = () => {
                            URL.revokeObjectURL(objectUrl);
                            const scale = Math.min(1, 1200 / Math.max(image.naturalWidth, image.naturalHeight));
                            const canvas = document.createElement('canvas');
                            canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
                            canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
                            const context = canvas.getContext('2d');
                            if (!context) {
                                reject(new Error('Image processing is unavailable in this browser.'));
                                return;
                            }
                            context.fillStyle = '#f5f8fc';
                            context.fillRect(0, 0, canvas.width, canvas.height);
                            context.drawImage(image, 0, 0, canvas.width, canvas.height);
                            resolve(canvas.toDataURL('image/jpeg', 0.72));
                        };
                        image.onerror = () => {
                            URL.revokeObjectURL(objectUrl);
                            reject(new Error('The selected image could not be opened.'));
                        };
                        image.src = objectUrl;
                    });
                }

                function closeSettings() {
                    settingsOverlay.classList.remove('show');
                    STATE.settingsOpen = false;
                }

                // ─── UPLOAD ──────────────────────────────────────────────
                async function handleUpload(fileList) {
                    if (!fileList || fileList.length === 0) return;

                    // Show uploading state
                    showNotification('⏳ Uploading ' + fileList.length + ' file(s)…', 'info');

                    try {
                        const result = await apiUploadFiles(fileList);
                        if (result.success) {
                            const msg = 'Uploaded ' + result.uploaded + ' file(s).' + (result.errors > 0 ? ' ' + result
                                .errors + ' failed.' : '');
                            showToast(msg, result.errors > 0 ? 'info' : 'success');
                            showNotification('✅ ' + msg, 'success');
                            await refreshView();
                            if (fileListView.classList.contains('active')) {
                                hideFileList();
                            }
                        } else {
                            showToast('Upload failed: ' + (result.message || 'Unknown error'), 'error');
                            showNotification('❌ Upload failed', 'error');
                        }
                    } catch (e) {
                        showToast('Network error: ' + e.message, 'error');
                        showNotification('❌ Network error', 'error');
                    }
                }

                // ─── Refresh ──────────────────────────────────────────────
                async function refreshView() {
                    try {
                        await apiFetchFiles();
                        renderCategories();
                        if (fileListView.classList.contains('active')) {
                            if (STATE.currentFilter === 'starred') {
                                const st = STATE.allFiles.filter(f => f.starred);
                                showFileList('Starred', st, 'fa-star');
                            } else if (STATE.currentFilter === 'safe') {
                                const sf = STATE.allFiles.filter(f => f.safe);
                                showFileList('Safe folder', sf, 'fa-shield-alt');
                            } else if (currentCategory && currentCategory !== 'all') {
                                const files = STATE.allFiles.filter(f => f.type === currentCategory);
                                const label = getCategoryLabel(currentCategory);
                                const icon = getCategoryIcon(currentCategory);
                                showFileList(label, files, icon);
                            } else {
                                showFileList('All Files', STATE.allFiles, 'fa-folder-open');
                            }
                        }
                        updateCounts();
                    } catch (e) {
                        showNotification('⚠ ' + e.message, 'error');
                    }
                }

                // ─── Event Listeners ─────────────────────────────────────
                searchInput.addEventListener('input', (e) => {
                    const query = e.target.value.toLowerCase().trim();
                    if (currentCategory === 'app') {
                        flItems.querySelectorAll('.installed-app-card').forEach(item => {
                            const text = item.querySelector('.installed-app-details')?.textContent?.toLowerCase() || '';
                            item.style.display = text.includes(query) ? '' : 'none';
                        });
                        return;
                    }
                    if (fileListView.classList.contains('active')) {
                        const items = flItems.querySelectorAll('.fl-item');
                        items.forEach(item => {
                            const name = item.querySelector('.fl-name')?.textContent?.toLowerCase() || '';
                            item.style.display = name.includes(query) ? '' : 'none';
                        });
                    }
                });

                flBack.addEventListener('click', hideFileList);

                // ─── UPLOAD BUTTON HANDLERS ──────────────────────────────
                // Both buttons trigger the hidden file input
                const uploadButtons = [flUploadBtn, uploadMainBtn];
                uploadButtons.forEach(btn => {
                    if (btn) {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            DOM.fileInput.click();
                        });
                    }
                });

                // File input change → upload
                DOM.fileInput.addEventListener('change', async (e) => {
                    if (e.target.files && e.target.files.length > 0) {
                        await handleUpload(e.target.files);
                        DOM.fileInput.value = '';
                    }
                });

                // ─── View toggle ──────────────────────────────────────────
                viewGridBtn.addEventListener('click', () => {
                    STATE.viewMode = 'grid';
                    viewGridBtn.classList.add('active');
                    viewListBtn.classList.remove('active');
                    if (fileListView.classList.contains('active')) renderFileItems(filteredFiles);
                });
                viewListBtn.addEventListener('click', () => {
                    STATE.viewMode = 'list';
                    viewListBtn.classList.add('active');
                    viewGridBtn.classList.remove('active');
                    if (fileListView.classList.contains('active')) renderFileItems(filteredFiles);
                });

                // ─── Collections ──────────────────────────────────────────
                starredBtn.addEventListener('click', () => {
                    const st = STATE.allFiles.filter(f => f.starred);
                    showFileList('Starred', st, 'fa-star');
                    currentCategory = null;
                    STATE.currentFilter = 'starred';
                });
                safeBtn.addEventListener('click', () => {
                    const sf = STATE.allFiles.filter(f => f.safe);
                    showFileList('Safe folder', sf, 'fa-shield-alt');
                    currentCategory = null;
                    STATE.currentFilter = 'safe';
                });
                allFilesBtn.addEventListener('click', () => {
                    showFileList('All Files', STATE.allFiles, 'fa-folder-open');
                    currentCategory = 'all';
                    STATE.currentFilter = null;
                });

                storageInfoBtn.addEventListener('click', openSettings);
                document.getElementById('storageUpgradeBtn').addEventListener('click', () => {
                    const upgradeOverlay = document.getElementById('upgradeOverlay');
                    upgradeOverlay.classList.add('show');
                    upgradeOverlay.setAttribute('aria-hidden', 'false');
                });
                document.getElementById('openIconRewards').addEventListener('click', () => {
                    window.location.href = '/virtual-phone/user/icon_rewards/index.php';
                });
                const upgradeOverlay = document.getElementById('upgradeOverlay');
                const closeUpgrade = () => {
                    upgradeOverlay.classList.remove('show');
                    upgradeOverlay.setAttribute('aria-hidden', 'true');
                };
                document.getElementById('upgradeCloseBtn').addEventListener('click', closeUpgrade);
                document.getElementById('upgradeDoneBtn').addEventListener('click', closeUpgrade);
                upgradeOverlay.addEventListener('click', event => {
                    if (event.target === upgradeOverlay) closeUpgrade();
                });

                previewClose.addEventListener('click', closePreview);
                previewOverlay.addEventListener('click', (e) => {
                    if (e.target === previewOverlay) closePreview();
                });

                settingsClose.addEventListener('click', closeSettings);
                settingsOverlay.addEventListener('click', (e) => {
                    if (e.target === settingsOverlay) closeSettings();
                });

                // ─── Drag & Drop ──────────────────────────────────────────
                const appBody = document.getElementById('appBody');
                appBody.addEventListener('dragover', (e) => { e.preventDefault();
                    appBody.classList.add('drag-active'); });
                appBody.addEventListener('dragleave', (e) => {
                    if (!appBody.contains(e.relatedTarget)) appBody.classList.remove('drag-active');
                });
                appBody.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    appBody.classList.remove('drag-active');
                    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                        await handleUpload(e.dataTransfer.files);
                    }
                });

                // ─── Initial Render ──────────────────────────────────────
                loadStorageAppearance();
                renderCategories();
                contentEl.classList.add('active');

                setTimeout(() => {
                    loadingEl.classList.add('hidden');
                }, 600);

                window._refreshStorage = refreshView;
            }

            // ─── APP LAUNCHER ────────────────────────────────────────────
            function handleAppLaunch(appName) {
                if (appName === 'storage') {
                    renderStorageApp();
                    return;
                }
                if (!STATE.isLoggedIn) {
                    showNotification('🔒 Please login first.', 'error');
                    showLoginPanel();
                    return;
                }
                const appNames = { instagram: 'Instagram', whatsapp: 'WhatsApp', facebook: 'Facebook', browser: 'Browser',
                    gallery: 'Gallery', camera: 'Camera', settings: 'Settings' };
                const label = appNames[appName] || appName;
                const iconMap = { instagram: 'fab fa-instagram', whatsapp: 'fab fa-whatsapp', facebook: 'fab fa-facebook-f',
                    browser: 'fas fa-globe', gallery: 'fas fa-image', camera: 'fas fa-camera',
                    settings: 'fas fa-cog' };
                const icon = iconMap[appName] || 'fas fa-apple-alt';
                openAppOverlay(
                    `<i class="${icon}"></i> ${label}`,
                    `<div style="padding:30px 20px;text-align:center;color:#888;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;">
                            <i class="${icon}" style="font-size:40px;color:#ccc;margin-bottom:14px;"></i>
                            <div style="font-weight:600;color:#444;font-size:15px;">${label}</div>
                            <div style="font-size:11px;margin-top:4px;color:#aaa;">App is under development</div>
                        </div>`
                );
            }

            // ─── INIT ────────────────────────────────────────────────────
            async function init() {
                updateClock();
                setInterval(updateClock, CONFIG.CLOCK_INTERVAL);
                rotateWallpaper();
                setInterval(rotateWallpaper, CONFIG.WALLPAPER_INTERVAL);
                window.addEventListener('focus', () => {
                    if (typeof window._refreshStorage === 'function') window._refreshStorage();
                });

                // Check session
                const user = loadCurrentUser();
                if (user) {
                    updateProfileUI(user);
                    hideLoginPanel();
                    toggleLogoutButton(true);
                    setTimeout(() => renderStorageApp(), 400);
                } else {
                    toggleLogoutButton(false);
                    setTimeout(() => {
                        fetch(API_BASE + 'list.php')
                            .then(r => r.json())
                            .then(data => {
                                if (data.success) {
                                    const demoUser = { username: 'Guest' };
                                    STATE.isLoggedIn = true;
                                    STATE.sessionUser = demoUser;
                                    localStorage.setItem('vphone_user', JSON.stringify(demoUser));
                                    updateProfileUI(demoUser);
                                    hideLoginPanel();
                                    toggleLogoutButton(true);
                                    renderStorageApp();
                                } else {
                                    showLoginPanel();
                                }
                            })
                            .catch(() => showLoginPanel());
                    }, 300);
                }

                // ─── Event bindings ──────────────────────────────────────
                document.addEventListener('touchstart', onTouchStart, { passive: true });
                document.addEventListener('touchmove', onTouchMove, { passive: true });
                document.addEventListener('wheel', onWheel, { passive: true });
                document.addEventListener('click', onDocumentClick);

                if (DOM.scrollIndicator) {
                    DOM.scrollIndicator.addEventListener('click', (e) => { e.stopPropagation();
                        showLoginPanel(); });
                }
                if (DOM.loginPanel) {
                    DOM.loginPanel.addEventListener('click', (e) => e.stopPropagation());
                }

                DOM.usernameInput.addEventListener('click', (e) => { e.stopPropagation();
                    showKeyboard(DOM.usernameInput); });
                DOM.passwordInput.addEventListener('click', (e) => { e.stopPropagation();
                    showKeyboard(DOM.passwordInput); });
                DOM.allKeys.forEach(key => key.addEventListener('click', onKeyClick));
                DOM.keyboard.addEventListener('click', (e) => e.stopPropagation());
                document.addEventListener('keydown', onPhysicalKeyDown);
                DOM.loginForm.addEventListener('submit', handleLogin);

                if (DOM.logoutApp) {
                    DOM.logoutApp.addEventListener('click', (e) => { e.stopPropagation();
                        logout(); });
                }
                if (DOM.storageApp) {
                    DOM.storageApp.addEventListener('click', (e) => { e.stopPropagation();
                        handleAppLaunch('storage'); });
                }

                document.querySelectorAll('.app[data-app]').forEach(el => {
                    const appName = el.dataset.app;
                    if (appName === 'storage') return;
                    el.addEventListener('click', (e) => { e.stopPropagation();
                        handleAppLaunch(appName); });
                });

                if (DOM.profileApp) {
                    DOM.profileApp.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (STATE.isLoggedIn) {
                            showNotification('👤 Logged in as ' + (STATE.sessionUser ? STATE.sessionUser
                                .username : 'User'), 'success');
                        } else {
                            showLoginPanel();
                        }
                    });
                }

                if (DOM.appCloseBtn) {
                    DOM.appCloseBtn.addEventListener('click', closeAppOverlay);
                }
                if (DOM.appOverlay) {
                    DOM.appOverlay.addEventListener('click', (e) => {
                        if (e.target === DOM.appOverlay) closeAppOverlay();
                    });
                }
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') closeAppOverlay();
                });

                window.vphone = window.vphone || {};
                window.vphone.logout = logout;
                window.vphone.showNotification = showNotification;
                window.vphone.getUser = () => STATE.sessionUser;
                window.vphone.isLoggedIn = () => STATE.isLoggedIn;
                window.vphone.openStorage = renderStorageApp;
                window.vphone.refreshStorage = () => { if (window._refreshStorage) window._refreshStorage(); };

                console.log('[Virtual Phone] ✅ API‑driven version ready.');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
